<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Fundo de Fogo com Partículas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style-fire.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    /* --- Seu CSS completo colado aqui --- */
    body {
      background-image: linear-gradient(to top, #630000, black 70%);
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      padding: 1rem;
      max-width: 480px;
      margin: 0 auto;
      animation: fadeInUp 1s ease-out;
      box-sizing: border-box;
      gap: 1rem;
      position: relative;
      z-index: 2;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      color: #fff200;
      font-size: 0.8em;
      justify-content: center;
      text-align: center;
    }

    .hero-content {
      text-align: center;
      animation: slideInLeft 1s ease-out;
      width: 100%;
    }

    .hero-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: white;
      line-height: 1.2;
      margin-bottom: 80px;
    }

    .highlight {
      color: #00eaff;
    }

    .hero-visual {
      display: flex;
      justify-content: center;
      align-items: center;
      animation: float 3s ease-in-out infinite;
      max-height: 120px;
      width: 100%;
    }

    .code-slider-container {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #0000007d;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .code-slider {
      display: flex;
      width: 300vw;
      animation: slide 4s infinite;
    }

    .code-preview {
      flex: 0 0 100vw;
      padding: 3.5em 1em 1em;
      color: #ccc;
      font-family: "Courier New", monospace;
      font-size: 0.75rem;
      box-sizing: border-box;
    }

    .code-header {
      display: flex;
      align-items: center;
      margin-bottom: 0.25rem;
    }

    .code-dots {
      display: flex;
      gap: 0.5rem;
    }

    .code-dots span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #444;
    }

    .code-dots span:nth-child(1) { background: #ff5f57; }
    .code-dots span:nth-child(2) { background: #ffbd2e; }
    .code-dots span:nth-child(3) { background: #28ca42; }

    .code-content {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-weight: bolder;
    }

    .code-content .code-line {
      display: block;
      margin-bottom: 0.2rem;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: #00eaff;
      color: black;
      padding: 0.6rem 1rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      transition: background-color 0.3s ease;
      width: 100%;
      max-width: 260px;
      margin-top: 80px;
    }

    .cta-button:hover {
      background-color: #ff5e01;
      color: #fff;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes slide {
      0%, 33.33% { transform: translateX(0); }
      44.44%, 77.77% { transform: translateX(-100vw); }
      88.88%, 100% { transform: translateX(-200vw); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-30px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .html .tag     { color: #ff79c6; }
    .html .attr    { color: #50fa7b; }
    .html .string  { color: #f1fa8c; }

    .css .selector { color: #8be9fd; }
    .css .property { color: #ff79c6; }
    .css .value    { color: #50fa7b; }

    .js .keyword   { color: #ff79c6; }
    .js .function  { color: #50fa7b; }
    .js .string    { color: #f1fa8c; }
  </style>
</head>
<body>

  <section class="hero">
    <div class="hero-content">
      <h1 class="hero-title">
        Códigos Prontos para <br> Seu Projeto,
        <span class="highlight">Sem <br> Esforço!</span>
      </h1>
    </div>

    <div class="hero-visual">
      <div class="code-slider-container">
        <div class="code-slider">
          <!-- HTML -->
          <div class="code-preview html">
            <div class="code-header"><div class="code-dots"><span></span><span></span><span></span></div></div>
            <p>html</p>
            <div class="code-content">
              <span class="code-line">&lt;<span class="tag">div</span> <span class="attr">class</span>=<span class="string">"container"</span>&gt;</span>
              <span class="code-line">  &lt;<span class="tag">h1</span>&gt;Olá Mundo&lt;/<span class="tag">h1</span>&gt;</span>
              <span class="code-line">&lt;/<span class="tag">div</span>&gt;</span>
            </div>
          </div>

          <!-- CSS -->
          <div class="code-preview css">
            <div class="code-header"><div class="code-dots"><span></span><span></span><span></span></div></div>
            <p>css</p>
            <div class="code-content">
              <span class="code-line"><span class="selector">.container</span> {</span>
              <span class="code-line">  <span class="property">background</span>: <span class="value">#282c34</span>;</span>
              <span class="code-line">  <span class="property">color</span>: <span class="value">#61dafb</span>;</span>
              <span class="code-line">}</span>
            </div>
          </div>

          <!-- JS -->
          <div class="code-preview js">
            <div class="code-header"><div class="code-dots"><span></span><span></span><span></span></div></div>
            <p>js</p>
            <div class="code-content">
              <span class="code-line"><span class="keyword">function</span> <span class="function">sayHello</span>() {</span>
              <span class="code-line">  <span class="keyword">return</span> <span class="string">'Olá Mundo!'</span>;</span>
              <span class="code-line">}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="hero-content">
      <a href="code-page.html" class="cta-button">
        <i class="fas fa-rocket"></i>
        Explorar Códigos
      </a>
    </div>
    <div class="hero-badge">
      <i class="fas fa-star"></i>
      <span>Código da Semana em Destaque</span>
    </div>
  </section>

  <canvas id="fireCanvas" style="position: fixed; top: 0; left: 0; z-index: 0;"></canvas>

  <script>
    const canvas = document.getElementById('fireCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    const particles = [];

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 100;
        this.size = Math.random() * 4 + 1;
        this.speedY = Math.random() * -3 - 1;
        this.speedX = Math.random() * 2 - 1;
        this.color = `hsl(${Math.random() * 50}, 100%, 50%)`;
      }

      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        if (this.size > 0.2) this.size -= 0.05;
      }

      draw() {
        ctx.beginPath();
        ctx.fillStyle = this.color;
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function handleParticles() {
      for (let i = 0; i < 5; i++) {
        particles.push(new Particle());
      }

      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();

        if (particles[i].size <= 0.2) {
          particles.splice(i, 1);
          i--;
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      handleParticles();
      requestAnimationFrame(animate);
    }

    animate();

    document.addEventListener("DOMContentLoaded", () => {
      const animatedElements = document.querySelectorAll(".benefit-card, .code-card");
      animatedElements.forEach((element, index) => {
        element.style.animationDelay = `${index * 0.1}s`;
      });
    });
  </script>

</body>
</html>
