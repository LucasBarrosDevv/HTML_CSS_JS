<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Script Store - Hero</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      background-image: url('img/img.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      overflow-x: hidden;
      color: white;
    }

    /* HERO SECTION */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      text-align: center;
      gap: 2rem;
      max-width: 1024px;
      margin: 0 auto;
    }

    .hero-logo-title {
      font-size: 2.2rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
    }

    .hero-logo-title span:first-child {
      color: #00d1ff;
    }

    .hero-logo-title span:last-child {
      color: orange;
    }

    .hero-title {
      font-size: 1.8rem;
      line-height: 1.3;
      font-weight: 700;
    }

    .highlight {
      display: block;
      color: #00eaff;
      margin-top: 0.3rem;
    }

    /* CODE SLIDER */
    .hero-visual {
      width: 100%;
      max-width: 600px;
      animation: float 3s ease-in-out infinite;
    }

    .code-slider-container {
      overflow: hidden;
      border-radius: 12px;
      background: #0000007d;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .code-slider {
      display: flex;
      width: 300%;
      animation: slide 6s infinite ease-in-out;
    }

    .code-preview {
      flex: 0 0 100%;
      padding: 1rem 1.5rem;
      font-family: "Courier New", monospace;
      font-size: 0.8rem;
      color: #ccc;
    }

    .code-header {
      display: flex;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .code-dots {
      display: flex;
      gap: 0.4rem;
    }

    .code-dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #444;
    }

    .code-dots span:nth-child(1) { background: #ff5f57; }
    .code-dots span:nth-child(2) { background: #ffbd2e; }
    .code-dots span:nth-child(3) { background: #28ca42; }

    .code-content {
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .code-line {
      display: block;
      margin-bottom: 0.3rem;
    }

    /* BUTTON */
    .cta-button {
      background-color: #00eaff;
      color: black;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .cta-button:hover {
      background-color: #ff5e01;
      color: white;
    }

    /* ANIMAÇÕES */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes slide {
      0%, 33.33% { transform: translateX(0); }
      44.44%, 77.77% { transform: translateX(-100%); }
      88.88%, 100% { transform: translateX(-200%); }
    }

    /* RESPONSIVO */
    @media (max-width: 768px) {
      .hero-logo-title {
        font-size: 1.8rem;
      }

      .hero-title {
        font-size: 1.4rem;
      }

      .code-preview {
        font-size: 0.7rem;
        padding: 1rem;
      }

      .cta-button {
        width: 100%;
        justify-content: center;
      }
    }

    @media (min-width: 1300px) {
      body {
        background-image: url('img/img-full.png');
      }

      .hero-title {
        font-size: 2.5rem;
      }

      .code-preview {
        font-size: 1rem;
      }

      .cta-button {
        font-size: 1.1rem;
        max-width: 300px;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1 class="hero-logo-title">
      <span>Script</span> <span>Store</span>
    </h1>

    <div class="hero-visual">
      <div class="code-slider-container">
        <div class="code-slider">
          <!-- HTML -->
          <div class="code-preview">
            <div class="code-header">
              <div class="code-dots"><span></span><span></span><span></span></div>
            </div>
            <p><strong>html</strong></p>
            <div class="code-content">
              <span class="code-line">&lt;div class="container"&gt;</span>
              <span class="code-line">  &lt;h1&gt;Olá Mundo&lt;/h1&gt;</span>
              <span class="code-line">&lt;/div&gt;</span>
            </div>
          </div>

          <!-- CSS -->
          <div class="code-preview">
            <div class="code-header">
              <div class="code-dots"><span></span><span></span><span></span></div>
            </div>
            <p><strong>css</strong></p>
            <div class="code-content">
              <span class="code-line">.container {</span>
              <span class="code-line">  background: #282c34;</span>
              <span class="code-line">  color: #61dafb;</span>
              <span class="code-line">}</span>
            </div>
          </div>

          <!-- JS -->
          <div class="code-preview">
            <div class="code-header">
              <div class="code-dots"><span></span><span></span><span></span></div>
            </div>
            <p><strong>js</strong></p>
            <div class="code-content">
              <span class="code-line">function sayHello() {</span>
              <span class="code-line">  return 'Olá Mundo!';</span>
              <span class="code-line">}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <h2 class="hero-title">
      Códigos Prontos para <br> Seu Projeto,
      <span class="highlight">Sem Esforço!</span>
    </h2>

    <a href="code-page.html" class="cta-button">
      <i class="fas fa-rocket"></i> Explorar Códigos
    </a>
  </section>
</body>
</html>
