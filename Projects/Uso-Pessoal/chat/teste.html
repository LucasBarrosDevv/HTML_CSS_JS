<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio 4x4 - Interface Moderna</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #581c87 50%, #0f172a 100%);
            color: white;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        .title {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1.125rem;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr 2fr;
            }
        }

        .card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .badge {
            background: #374151;
            color: #d1d5db;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 0.75rem;
        }

        .input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.75rem;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid #475569;
            color: white;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .input::placeholder {
            color: #94a3b8;
        }

        .btn {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #059669, #047857);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .players-list {
            max-height: 16rem;
            overflow-y: auto;
            margin-top: 1rem;
        }

        .players-list::-webkit-scrollbar {
            width: 4px;
        }

        .players-list::-webkit-scrollbar-track {
            background: rgba(51, 65, 85, 0.3);
            border-radius: 2px;
        }

        .players-list::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.5);
            border-radius: 2px;
        }

        .player-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: rgba(15, 23, 42, 0.3);
            border-radius: 0.5rem;
            border: 1px solid rgba(71, 85, 105, 0.3);
            margin-bottom: 0.5rem;
            transition: all 0.2s;
        }

        .player-item:hover {
            background: rgba(15, 23, 42, 0.5);
        }

        .player-number {
            width: 2rem;
            height: 2rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            font-weight: bold;
        }

        .teams-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .teams-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .team-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .team-a {
            border: 1px solid rgba(34, 197, 94, 0.3);
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(5, 150, 105, 0.1));
        }

        .team-b {
            border: 1px solid rgba(245, 158, 11, 0.3);
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(217, 119, 6, 0.1));
        }

        .team-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .team-title {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .team-a .team-title {
            color: #22c55e;
        }

        .team-b .team-title {
            color: #f59e0b;
        }

        .team-member {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.3);
            border-radius: 0.75rem;
            margin-bottom: 0.75rem;
            transition: all 0.2s;
        }

        .team-member:hover {
            background: rgba(15, 23, 42, 0.5);
        }

        .team-a .team-member {
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .team-b .team-member {
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .member-number {
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            font-weight: bold;
            color: white;
        }

        .team-a .member-number {
            background: linear-gradient(135deg, #22c55e, #059669);
        }

        .team-b .member-number {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .empty-slot {
            padding: 1rem;
            background: rgba(15, 23, 42, 0.1);
            border: 1px dashed rgba(71, 85, 105, 0.2);
            border-radius: 0.75rem;
            margin-bottom: 0.75rem;
            color: #64748b;
            text-align: center;
        }

        .waiting-state {
            text-align: center;
            padding: 3rem;
            color: #64748b;
        }

        .waiting-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .icon {
            width: 1.25rem;
            height: 1.25rem;
        }

        .icon-lg {
            width: 1.5rem;
            height: 1.5rem;
        }

        .spinning {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
            
            body {
                padding: 1rem;
            }
            
            .header {
                margin-bottom: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">🎮</div>
            <h1 class="title">Sorteio 4x4</h1>
            <p class="subtitle">Organize suas equipes de forma justa e aleatória</p>
        </div>

        <div class="main-grid">
            <!-- Left Panel - Controls -->
            <div>
                <!-- Add Player Card -->
                <div class="card" style="margin-bottom: 1.5rem;">
                    <div class="card-header">
                        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                        </svg>
                        <h2 class="card-title">Adicionar Jogador</h2>
                    </div>
                    <div class="input-group">
                        <input 
                            type="text" 
                            id="username" 
                            class="input" 
                            placeholder="Digite seu nome ou ID"
                            onkeypress="handleKeyPress(event)"
                        />
                    </div>
                    <button onclick="cadastrarJogador()" class="btn btn-primary">
                        Entrar no Sorteio
                    </button>
                </div>

                <!-- Shuffle Button -->
                <div class="card" style="margin-bottom: 1.5rem;">
                    <button onclick="sortearEquipes()" id="shuffleBtn" class="btn btn-secondary">
                        <svg class="icon" id="shuffleIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
                        </svg>
                        <span id="shuffleText">Sortear Equipes</span>
                    </button>
                </div>

                <!-- Players List -->
                <div class="card">
                    <div class="card-header">
                        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"/>
                        </svg>
                        <h2 class="card-title">Jogadores Inscritos</h2>
                        <span class="badge" id="playerCount">9</span>
                    </div>
                    <div class="players-list" id="listaJogadores">
                        <!-- Players will be populated here -->
                    </div>
                </div>
            </div>

            <!-- Right Panel - Teams -->
            <div>
                <div id="waitingState" class="card waiting-state">
                    <div class="waiting-icon">🏆</div>
                    <h3 style="font-size: 1.5rem; font-weight: 600; color: #94a3b8; margin-bottom: 0.5rem;">
                        Pronto para o sorteio!
                    </h3>
                    <p>Clique em "Sortear Equipes" para formar os times</p>
                </div>

                <div id="teamsContainer" class="teams-grid" style="display: none;">
                    <!-- Team A -->
                    <div class="team-card team-a">
                        <div class="team-header">
                            <svg class="icon-lg" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                            </svg>
                            <h3 class="team-title">Time A</h3>
                        </div>
                        <div id="timeA">
                            <!-- Team A members will be populated here -->
                        </div>
                    </div>

                    <!-- Team B -->
                    <div class="team-card team-b">
                        <div class="team-header">
                            <svg class="icon-lg" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                            </svg>
                            <h3 class="team-title">Time B</h3>
                        </div>
                        <div id="timeB">
                            <!-- Team B members will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const jogadores = new Set([
            
        ]);

        let isShuffling = false;
        let hasShuffled = false;

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            atualizarListaJogadores();
        });

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                cadastrarJogador();
            }
        }

        function cadastrarJogador() {
            const nome = document.getElementById('username').value.trim();
            if (!nome) {
                alert("Digite um nome válido!");
                return;
            }
            if (jogadores.has(nome)) {
                alert("Esse nome já foi cadastrado.");
                return;
            }
            
            jogadores.add(nome);
            atualizarListaJogadores();
            document.getElementById('username').value = '';
        }

        function atualizarListaJogadores() {
            const lista = document.getElementById('listaJogadores');
            const playerCount = document.getElementById('playerCount');
            
            lista.innerHTML = '';
            playerCount.textContent = jogadores.size;
            
            if (jogadores.size === 0) {
                lista.innerHTML = '<p style="text-align: center; color: #64748b; padding: 1rem;">Nenhum jogador inscrito</p>';
                return;
            }
            
            Array.from(jogadores).forEach((jogador, i) => {
                const div = document.createElement('div');
                div.className = 'player-item fade-in';
                div.innerHTML = `
                    <span class="player-number">${i + 1}</span>
                    <span style="color: #e2e8f0; font-weight: 500;">${jogador}</span>
                `;
                lista.appendChild(div);
            });
        }

        async function sortearEquipes() {
    const senha = prompt("Digite a senha para sortear as equipes:");
    if (senha !== "9134") {
        alert("Senha incorreta! Você não tem permissão para sortear.");
        return;
    }

    const total = jogadores.size;
    if (total < 2) {
        alert("É necessário pelo menos 2 jogadores para sortear.");
        return;
    }

    if (isShuffling) return;

    isShuffling = true;
    const shuffleBtn = document.getElementById('shuffleBtn');
    const shuffleIcon = document.getElementById('shuffleIcon');
    const shuffleText = document.getElementById('shuffleText');

    // Update button state
    shuffleBtn.disabled = true;
    shuffleIcon.classList.add('spinning');
    shuffleText.textContent = 'Sorteando...';

    // Simulate shuffling animation
    await new Promise(resolve => setTimeout(resolve, 1500));

    const sorteio = Array.from(jogadores);
    embaralharArray(sorteio);

    const timeA = sorteio.slice(0, 4);
    const timeB = sorteio.slice(4, 8);

    exibirTimes(timeA, timeB);

    // Reset button state
    isShuffling = false;
    hasShuffled = true;
    shuffleBtn.disabled = false;
    shuffleIcon.classList.remove('spinning');
    shuffleText.textContent = 'Sortear Equipes';

    // Show teams container
    document.getElementById('waitingState').style.display = 'none';
    document.getElementById('teamsContainer').style.display = 'grid';
}


        function embaralharArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function exibirTimes(timeA, timeB) {
            const ulA = document.getElementById('timeA');
            const ulB = document.getElementById('timeB');
            
            ulA.innerHTML = '';
            ulB.innerHTML = '';
            
            // Populate Team A
            timeA.forEach((jogador, index) => {
                const div = document.createElement('div');
                div.className = 'team-member fade-in';
                div.innerHTML = `
                    <span class="member-number">${index + 1}</span>
                    <span style="color: white; font-weight: 600;">${jogador}</span>
                `;
                ulA.appendChild(div);
            });
            
            // Fill empty slots for Team A
            for (let i = timeA.length; i < 4; i++) {
                const div = document.createElement('div');
                div.className = 'empty-slot';
                div.textContent = 'Aguardando jogador...';
                ulA.appendChild(div);
            }
            
            // Populate Team B
            timeB.forEach((jogador, index) => {
                const div = document.createElement('div');
                div.className = 'team-member fade-in';
                div.innerHTML = `
                    <span class="member-number">${index + 1}</span>
                    <span style="color: white; font-weight: 600;">${jogador}</span>
                `;
                ulB.appendChild(div);
            });
            
            // Fill empty slots for Team B
            for (let i = timeB.length; i < 4; i++) {
                const div = document.createElement('div');
                div.className = 'empty-slot';
                div.textContent = 'Aguardando jogador...';
                ulB.appendChild(div);
            }
        }
    </script>
</body>
</html>
