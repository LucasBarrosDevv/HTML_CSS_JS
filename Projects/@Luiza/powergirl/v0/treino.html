<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Treino</title>
   Chart.js CDN para gráficos 
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
      /* Reset e variáveis CSS */
      :root {
          --primary-color: #4CAF50; /* Um verde vibrante */
          --secondary-color: #FFC107; /* Um amarelo para destaque */
          --background-color: #f0f2f5;
          --card-background: #ffffff;
          --text-color: #333333;
          --light-text-color: #666666;
          --border-color: #e0e0e0;
          --shadow-light: rgba(0, 0, 0, 0.05);
          --shadow-medium: rgba(0, 0, 0, 0.1);
      }

      * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
      }

      body {
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background-color: var(--background-color);
          color: var(--text-color);
          line-height: 1.6;
          display: flex;
          justify-content: center;
          align-items: flex-start; /* Alinha ao topo para melhor rolagem */
          min-height: 100vh;
          padding: 20px;
          overflow-x: hidden; /* Evita rolagem horizontal */
      }

      .app-container {
          background-color: var(--card-background);
          border-radius: 16px;
          box-shadow: 0 10px 30px var(--shadow-medium);
          width: 100%;
          max-width: 450px; /* Largura máxima para mobile */
          overflow: hidden;
          display: flex;
          flex-direction: column;
          min-height: calc(100vh - 40px); /* Ajusta altura para preencher a tela */
          position: relative;
      }

      header {
          background-color: var(--primary-color);
          color: white;
          padding: 20px;
          text-align: center;
          border-top-left-radius: 16px;
          border-top-right-radius: 16px;
          box-shadow: 0 2px 10px var(--shadow-light);
          position: sticky;
          top: 0;
          z-index: 10;
      }

      header h1 {
          font-size: 1.8em;
          margin-bottom: 5px;
      }

      header p {
          font-size: 0.9em;
          opacity: 0.9;
      }

      main {
          flex-grow: 1;
          padding: 20px;
          overflow-y: auto; /* Permite rolagem do conteúdo principal */
          -webkit-overflow-scrolling: touch; /* Rolagem suave em iOS */
      }

      section {
          display: none; /* Esconde todas as seções por padrão */
          opacity: 0;
          transform: translateY(20px);
          transition: opacity 0.3s ease-out, transform 0.3s ease-out;
      }

      section.active {
          display: block;
          opacity: 1;
          transform: translateY(0);
      }

      /* Home Section */
      #home-section {
          text-align: center;
          padding: 40px 20px;
      }

      #home-section h2 {
          font-size: 1.5em;
          margin-bottom: 20px;
          color: var(--primary-color);
      }

      .big-button {
          background-color: var(--primary-color);
          color: white;
          border: none;
          border-radius: 12px;
          padding: 20px 30px;
          font-size: 1.4em;
          font-weight: bold;
          cursor: pointer;
          width: 100%;
          max-width: 300px;
          margin-top: 30px;
          box-shadow: 0 5px 15px var(--shadow-medium);
          transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
      }

      .big-button:hover {
          background-color: #43A047; /* Um pouco mais escuro */
          transform: translateY(-2px);
          box-shadow: 0 7px 20px var(--shadow-medium);
      }

      .big-button:active {
          transform: translateY(0);
          box-shadow: 0 3px 10px var(--shadow-light);
      }

      .secondary-button {
          background-color: transparent;
          color: var(--primary-color);
          border: 2px solid var(--primary-color);
          border-radius: 12px;
          padding: 15px 25px;
          font-size: 1.1em;
          font-weight: bold;
          cursor: pointer;
          width: 100%;
          max-width: 300px;
          margin-top: 20px;
          transition: background-color 0.2s ease, color 0.2s ease;
      }

      .secondary-button:hover {
          background-color: var(--primary-color);
          color: white;
      }

      /* Workout Section */
      #workout-section .timer-display {
          font-size: 2.5em;
          font-weight: bold;
          text-align: center;
          margin-bottom: 20px;
          color: var(--primary-color);
          padding: 10px;
          background-color: #e8f5e9; /* Light green background */
          border-radius: 8px;
      }

      .exercise-list {
          list-style: none;
          padding: 0;
      }

      .exercise-item {
          background-color: var(--card-background);
          border: 1px solid var(--border-color);
          border-radius: 12px;
          margin-bottom: 15px;
          padding: 15px;
          display: flex;
          align-items: center;
          gap: 15px;
          box-shadow: 0 2px 8px var(--shadow-light);
          transition: transform 0.2s ease;
      }

      .exercise-item:hover {
          transform: translateY(-3px);
      }

      .exercise-icon {
          font-size: 2.5em;
          line-height: 1;
          flex-shrink: 0;
      }

      .exercise-details {
          flex-grow: 1;
      }

      .exercise-details h3 {
          font-size: 1.2em;
          margin-bottom: 5px;
          color: var(--text-color);
      }

      .exercise-details p {
          font-size: 0.9em;
          color: var(--light-text-color);
      }

      .exercise-actions {
          display: flex;
          flex-direction: column;
          gap: 8px;
          flex-shrink: 0;
      }

      .satisfaction-button {
          background-color: #f0f0f0;
          border: 1px solid var(--border-color);
          border-radius: 8px;
          padding: 8px 12px;
          font-size: 0.9em;
          cursor: pointer;
          transition: background-color 0.2s ease, border-color 0.2s ease;
      }

      .satisfaction-button.liked {
          background-color: #e8f5e9; /* Light green */
          border-color: var(--primary-color);
          color: var(--primary-color);
      }

      .satisfaction-button.disliked {
          background-color: #ffebee; /* Light red */
          border-color: #EF5350; /* Red */
          color: #EF5350;
      }

      .satisfaction-button:hover {
          background-color: #e0e0e0;
      }

      .satisfaction-button.liked:hover {
          background-color: #dcedc8;
      }

      .satisfaction-button.disliked:hover {
          background-color: #ffcdd2;
      }

      .workout-controls {
          display: flex;
          flex-direction: column;
          gap: 15px;
          margin-top: 20px;
      }

      /* Rest Timer Modal */
      .modal-overlay {
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-color: rgba(0, 0, 0, 0.6);
          justify-content: center;
          align-items: center;
          z-index: 100;
          opacity: 0;
          transition: opacity 0.3s ease-out;
      }

      .modal-overlay.active {
          display: flex;
          opacity: 1;
      }

      .modal-content {
          background-color: var(--card-background);
          padding: 30px;
          border-radius: 16px;
          text-align: center;
          box-shadow: 0 10px 30px var(--shadow-medium);
          width: 90%;
          max-width: 400px;
          transform: translateY(-20px);
          transition: transform 0.3s ease-out;
      }

      .modal-overlay.active .modal-content {
          transform: translateY(0);
      }

      .modal-content h3 {
          font-size: 1.8em;
          margin-bottom: 20px;
          color: var(--primary-color);
      }

      .rest-timer-display {
          font-size: 3em;
          font-weight: bold;
          color: var(--primary-color);
          margin-bottom: 30px;
      }

      .modal-buttons {
          display: flex;
          flex-direction: column;
          gap: 10px;
      }

      .modal-buttons button {
          padding: 15px 20px;
          border: none;
          border-radius: 10px;
          font-size: 1.1em;
          cursor: pointer;
          transition: background-color 0.2s ease;
      }

      .modal-buttons .start-rest-button {
          background-color: var(--primary-color);
          color: white;
      }

      .modal-buttons .start-rest-button:hover {
          background-color: #43A047;
      }

      .modal-buttons .stop-rest-button {
          background-color: #f44336; /* Red */
          color: white;
      }

      .modal-buttons .stop-rest-button:hover {
          background-color: #d32f2f;
      }

      .modal-buttons .close-modal-button {
          background-color: #e0e0e0;
          color: var(--text-color);
      }

      .modal-buttons .close-modal-button:hover {
          background-color: #cccccc;
      }

      /* History Section */
      #history-section {
          padding: 20px 0;
      }

      #history-section h2 {
          font-size: 1.5em;
          margin-bottom: 20px;
          text-align: center;
          color: var(--primary-color);
      }

      .chart-container {
          position: relative;
          height: 300px; /* Altura fixa para o gráfico */
          width: 100%;
          margin-bottom: 20px;
      }

      .no-history-message {
          text-align: center;
          color: var(--light-text-color);
          margin-top: 30px;
          font-style: italic;
      }

      /* Navigation */
      nav {
          display: flex;
          justify-content: space-around;
          padding: 15px 0;
          border-top: 1px solid var(--border-color);
          background-color: var(--card-background);
          box-shadow: 0 -2px 10px var(--shadow-light);
          border-bottom-left-radius: 16px;
          border-bottom-right-radius: 16px;
          position: sticky;
          bottom: 0;
          z-index: 10;
      }

      nav button {
          background: none;
          border: none;
          color: var(--light-text-color);
          font-size: 0.9em;
          font-weight: bold;
          cursor: pointer;
          padding: 10px 15px;
          border-radius: 8px;
          transition: color 0.2s ease, background-color 0.2s ease;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 5px;
      }

      nav button .nav-icon {
          font-size: 1.5em;
      }

      nav button.active {
          color: var(--primary-color);
          background-color: #e8f5e9;
      }

      nav button:hover:not(.active) {
          color: var(--primary-color);
      }

      /* Responsive adjustments */
      @media (min-width: 600px) {
          .app-container {
              min-height: auto; /* Remove min-height for larger screens */
          }
      }
  </style>
</head>
<body>
  <div class="app-container">
      <header>
          <h1 id="current-day-display"></h1>
          <p id="current-group-display"></p>
      </header>

      <main>
           Home Section 
          <section id="home-section" class="active">
              <h2>Bem-vindo ao seu Treino!</h2>
              <button id="start-workout-btn" class="big-button">Iniciar Treino</button>
          </section>

           Workout Section 
          <section id="workout-section">
              <div class="timer-display" id="workout-timer-display">00:00:00</div>
              <ul class="exercise-list" id="exercise-list">
                   Exercises will be loaded here by JavaScript 
              </ul>
              <div class="workout-controls">
                  <button id="start-rest-timer-btn" class="secondary-button">Ativar Temporizador de Descanso</button>
                  <button id="end-workout-btn" class="big-button" style="background-color: #f44336;">Finalizar Treino</button>
              </div>
          </section>

           History Section 
          <section id="history-section">
              <h2>Histórico de Treinos</h2>
              <div class="chart-container">
                  <canvas id="workoutHistoryChart"></canvas>
              </div>
              <p id="no-history-message" class="no-history-message" style="display: none;">Nenhum treino registrado ainda.</p>
          </section>
      </main>

       Rest Timer Modal 
      <div id="rest-timer-modal" class="modal-overlay">
          <div class="modal-content">
              <h3>Temporizador de Descanso</h3>
              <div class="rest-timer-display" id="rest-timer-countdown">00:30</div>
              <div class="modal-buttons">
                  <button class="start-rest-button" data-duration="30">30s</button>
                  <button class="start-rest-button" data-duration="60">1min</button>
                  <button class="start-rest-button" data-duration="90">1min 30s</button>
                  <button class="stop-rest-button" id="stop-rest-timer-btn" style="display: none;">Parar</button>
                  <button class="close-modal-button" id="close-rest-modal-btn">Fechar</button>
              </div>
          </div>
      </div>

      <nav>
          <button id="nav-home" class="active">
              <span class="nav-icon">🏠</span>
              Home
          </button>
          <button id="nav-workout">
              <span class="nav-icon">🏋️</span>
              Treino
          </button>
          <button id="nav-history">
              <span class="nav-icon">📊</span>
              Histórico
          </button>
      </nav>
  </div>

  <script>
      // Dados dos treinos
      const workoutData = [

                  { id: "qua-ex3", name: "Cadeira Extensora", icon: "🦵", sets: 3, reps: "12-15", notes: "Contraia o quadríceps no topo." },
                  { id: "qua-ex4", name: "Desenvolvimento com Halteres (Sentado)", icon: "⬆️", sets: 4, reps: "8-12", notes: "Suba os halteres acima da cabeça, controle a descida." },
                  { id: "qua-ex5", name: "Elevação Lateral com Halteres", icon: "↔️", sets: 3, reps: "12-15", notes: "Suba até a altura dos ombros, sem balançar." }
              ]
          },
          {
              day: "Quinta-feira", // Repete Grupo 1, exercícios diferentes
              group: "Peito e Tríceps",
              exercises: [
                  { id: "qui-ex1", name: "Supino Reto com Halteres", icon: "💪", sets: 3, reps: "10-15", notes: "Maior amplitude e estabilização." },
                  { id: "qui-ex2", name: "Crossover na Polia Alta", icon: "↔️", sets: 4, reps: "12-15", notes: "Cruze as mãos na frente do corpo, contraia o peito." },
                  { id: "qui-ex3", name: "Flexão de Braço", icon: "🤸", sets: 3, reps: "Até a falha", notes: "Mantenha o corpo reto, desça o máximo possível." },
                  { id: "qui-ex4", name: "Tríceps Francês com Haltere", icon: "🏋️", sets: 3, reps: "10-15", notes: "Desça o haltere atrás da cabeça, estenda bem." },
                  { id: "qui-ex5", name: "Coice com Halteres", icon: "⬇️", sets: 3, reps: "12-15", notes: "Mantenha o braço parado, mova apenas o antebraço." }
              ]
          },
          {
              day: "Sexta-feira", // Repete Grupo 2, exercícios diferentes
              group: "Costas e Bíceps",
              exercises: [
                  { id: "sex-ex1", name: "Barra Fixa (ou Puxada Frontal)", icon: "⬆️", sets: 3, reps: "Até a falha", notes: "Se não conseguir, use a máquina assistida ou puxada frontal." },
                  { id: "sex-ex2", name: "Remada Unilateral com Haltere", icon: "🚣", sets: 3, reps: "10-12 (cada lado)", notes: "Puxe o haltere em direção ao quadril, sinta a escápula." },
                  { id: "sex-ex3", name: "Pullover com Haltere", icon: "↔️", sets: 3, reps: "12-15", notes: "Alongue bem as costas e o peito." },
                  { id: "sex-ex4", name: "Rosca Scott", icon: "💪", sets: 3, reps: "10-15", notes: "Foco total no bíceps, sem roubar." },
                  { id: "sex-ex5", name: "Rosca Concentrada", icon: "🎯", sets: 3, reps: "10-12 (cada lado)", notes: "Movimento lento e controlado, máxima contração." }
              ]
          },
          {
              day: "Sábado", // Repete Grupo 3, exercícios diferentes
              group: "Pernas e Ombros",
              exercises: [
                  { id: "sab-ex1", name: "Afundo com Halteres", icon: "🚶", sets: 3, reps: "10-12 (cada perna)", notes: "Mantenha o equilíbrio, desça o joelho de trás próximo ao chão." },
                  { id: "sab-ex2", name: "Cadeira Flexora", icon: "🦵", sets: 3, reps: "12-15", notes: "Contraia o posterior de coxa no final do movimento." },
                  { id: "sab-ex3", name: "Panturrilha em Pé", icon: "⬆️", sets: 4, reps: "15-20", notes: "Suba o máximo possível, segure no topo." },
                  { id: "sab-ex4", name: "Desenvolvimento Militar (Barra)", icon: "🏋️", sets: 3, reps: "8-12", notes: "Mantenha o core firme, evite arquear as costas." },
                  { id: "sab-ex5", name: "Remada Alta com Barra", icon: "⬆️", sets: 3, reps: "10-15", notes: "Puxe a barra até o queixo, cotovelos para cima." }
              ]
          }
      ];

      // Mapeamento de dias da semana para índices do array workoutData
      const dayMap = {
          0: 0, // Domingo (sem treino)
          1: 0, // Segunda-feira
          2: 1, // Terça-feira
          3: 2, // Quarta-feira
          4: 3, // Quinta-feira
          5: 4, // Sexta-feira
          6: 5  // Sábado
      };

      // Elementos do DOM
      const currentDayDisplay = document.getElementById('current-day-display');
      const currentGroupDisplay = document.getElementById('current-group-display');
      const startWorkoutBtn = document.getElementById('start-workout-btn');
      const endWorkoutBtn = document.getElementById('end-workout-btn');
      const workoutTimerDisplay = document.getElementById('workout-timer-display');
      const exerciseList = document.getElementById('exercise-list');
      const startRestTimerBtn = document.getElementById('start-rest-timer-btn');
      const restTimerModal = document.getElementById('rest-timer-modal');
      const restTimerCountdown = document.getElementById('rest-timer-countdown');
      const stopRestTimerBtn = document.getElementById('stop-rest-timer-btn');
      const closeRestModalBtn = document.getElementById('close-rest-modal-btn');
      const restDurationButtons = document.querySelectorAll('.modal-buttons .start-rest-button');
      const noHistoryMessage = document.getElementById('no-history-message');

      // Navegação
      const navHomeBtn = document.getElementById('nav-home');
      const navWorkoutBtn = document.getElementById('nav-workout');
      const navHistoryBtn = document.getElementById('nav-history');
      const homeSection = document.getElementById('home-section');
      const workoutSection = document.getElementById('workout-section');
      const historySection = document.getElementById('history-section');

      // Variáveis de estado
      let workoutTimerInterval;
      let workoutStartTime;
      let restTimerInterval;
      let restTimerSeconds = 0;
      let workoutHistory = [];
      let workoutChart; // Variável para a instância do Chart.js

      // --- Funções de Utilidade ---

      /**
       * Formata segundos em HH:MM:SS.
       * @param {number} totalSeconds - O número total de segundos.
       * @returns {string} Tempo formatado.
       */
      function formatTime(totalSeconds) {
          const hours = Math.floor(totalSeconds / 3600);
          const minutes = Math.floor((totalSeconds % 3600) / 60);
          const seconds = totalSeconds % 60;

          return [hours, minutes, seconds]
              .map(unit => unit < 10 ? '0' + unit : unit)
              .join(':');
      }

      /**
       * Exibe uma seção específica do aplicativo e esconde as outras.
       * @param {HTMLElement} sectionToShow - A seção a ser exibida.
       * @param {HTMLElement} navButtonToActivate - O botão de navegação correspondente a ser ativado.
       */
      function showSection(sectionToShow, navButtonToActivate) {
          // Esconde todas as seções
          document.querySelectorAll('main section').forEach(section => {
              section.classList.remove('active');
          });
          // Desativa todos os botões de navegação
          document.querySelectorAll('nav button').forEach(button => {
              button.classList.remove('active');
          });

          // Exibe a seção desejada
          sectionToShow.classList.add('active');
          // Ativa o botão de navegação correspondente
          if (navButtonToActivate) {
              navButtonToActivate.classList.add('active');
          }

          // Se for a seção de histórico, atualiza o gráfico
          if (sectionToShow.id === 'history-section') {
              updateWorkoutHistoryChart();
          }
      }

      // --- Funções de Inicialização e Carregamento de Dados ---

      /**
       * Carrega o histórico de treinos do localStorage.
       */
      function loadWorkoutHistory() {
          const history = localStorage.getItem('workoutHistory');
          if (history) {
              workoutHistory = JSON.parse(history);
          }
      }

      /**
       * Salva o histórico de treinos no localStorage.
       */
      function saveWorkoutHistory() {
          localStorage.setItem('workoutHistory', JSON.stringify(workoutHistory));
      }

      /**
       * Carrega a avaliação de um exercício do localStorage.
       * @param {string} exerciseId - ID do exercício.
       * @returns {string|null} 'liked', 'disliked' ou null.
       */
      function loadExerciseSatisfaction(exerciseId) {
          return localStorage.getItem(`exerciseSatisfaction_${exerciseId}`);
      }

      /**
       * Salva a avaliação de um exercício no localStorage.
       * @param {string} exerciseId - ID do exercício.
       * @param {string} status - 'liked' ou 'disliked'.
       */
      function saveExerciseSatisfaction(exerciseId, status) {
          localStorage.setItem(`exerciseSatisfaction_${exerciseId}`, status);
      }

      /**
       * Remove a avaliação de um exercício do localStorage.
       * @param {string} exerciseId - ID do exercício.
       */
      function removeExerciseSatisfaction(exerciseId) {
          localStorage.removeItem(`exerciseSatisfaction_${exerciseId}`);
      }

      /**
       * Inicializa o aplicativo: carrega dados, exibe o treino do dia.
       */
      function initApp() {
          loadWorkoutHistory();
          displayCurrentDayWorkout();
          updateWorkoutHistoryChart(); // Garante que o gráfico seja inicializado
          showSection(homeSection, navHomeBtn); // Começa na tela inicial
      }

      /**
       * Exibe o treino do dia atual.
       */
      function displayCurrentDayWorkout() {
          const today = new Date();
          const dayOfWeek = today.getDay(); // 0 = Domingo, 1 = Segunda, ..., 6 = Sábado

          // Ajusta o índice para o array workoutData
          let workoutIndex = dayMap[dayOfWeek];
          if (dayOfWeek === 0) { // Domingo não tem treino específico, mostra segunda
              workoutIndex = 0;
              currentDayDisplay.textContent = "Domingo (Próximo: Segunda)";
          } else {
              currentDayDisplay.textContent = workoutData[workoutIndex].day;
          }

          const currentWorkout = workoutData[workoutIndex];
          currentGroupDisplay.textContent = currentWorkout.group;

          exerciseList.innerHTML = ''; // Limpa a lista anterior

          currentWorkout.exercises.forEach(exercise => {
              const listItem = document.createElement('li');
              listItem.classList.add('exercise-item');

              const satisfactionStatus = loadExerciseSatisfaction(exercise.id);

              listItem.innerHTML = `
                  <span class="exercise-icon" aria-label="${exercise.name}">${exercise.icon}</span>
                  <div class="exercise-details">
                      <h3>${exercise.name}</h3>
                      <p>Séries: ${exercise.sets} | Repetições: ${exercise.reps}</p>
                      <p class="notes">${exercise.notes}</p>
                  </div>
                  <div class="exercise-actions">
                      <button class="satisfaction-button like-btn ${satisfactionStatus === 'liked' ? 'liked' : ''}" data-id="${exercise.id}" data-status="liked">Gostei 👍</button>
                      <button class="satisfaction-button dislike-btn ${satisfactionStatus === 'disliked' ? 'disliked' : ''}" data-id="${exercise.id}" data-status="disliked">Não Gostei 👎</button>
                  </div>
              `;
              exerciseList.appendChild(listItem);
          });

          // Adiciona event listeners para os botões de satisfação
          document.querySelectorAll('.satisfaction-button').forEach(button => {
              button.addEventListener('click', (event) => {
                  const exerciseId = event.target.dataset.id;
                  const status = event.target.dataset.status;

                  // Remove classes de todos os botões do mesmo exercício
                  document.querySelectorAll(`.satisfaction-button[data-id="${exerciseId}"]`).forEach(btn => {
                      btn.classList.remove('liked', 'disliked');
                  });

                  // Adiciona a classe ao botão clicado
                  event.target.classList.add(status);
                  saveExerciseSatisfaction(exerciseId, status);
              });
          });
      }

      // --- Funções do Cronômetro de Treino Principal ---

      /**
       * Inicia o cronômetro de treino principal.
       */
      function startWorkout() {
          workoutStartTime = Date.now();
          workoutTimerInterval = setInterval(updateWorkoutTimer, 1000);
          showSection(workoutSection, navWorkoutBtn);
      }

      /**
       * Atualiza o display do cronômetro de treino.
       */
      function updateWorkoutTimer() {
          const elapsedTime = Math.floor((Date.now() - workoutStartTime) / 1000);
          workoutTimerDisplay.textContent = formatTime(elapsedTime);
      }

      /**
       * Finaliza o treino, para o cronômetro e salva o tempo.
       */
      function endWorkout() {
          clearInterval(workoutTimerInterval);
          const endTime = Date.now();
          const durationSeconds = Math.floor((endTime - workoutStartTime) / 1000);

          const today = new Date();
          const dateString = today.toISOString().split('T')[0]; // YYYY-MM-DD

          workoutHistory.push({
              date: dateString,
              duration: durationSeconds
          });
          saveWorkoutHistory();
          updateWorkoutHistoryChart();

          alert(`Treino finalizado! Duração: ${formatTime(durationSeconds)}`);
          workoutTimerDisplay.textContent = '00:00:00'; // Reseta o display
          showSection(homeSection, navHomeBtn); // Volta para a tela inicial
      }

      // --- Funções do Temporizador de Descanso ---

      /**
       * Inicia o temporizador de descanso.
       * @param {number} durationSeconds - Duração do descanso em segundos.
       */
      function startRestTimer(durationSeconds) {
          clearInterval(restTimerInterval); // Garante que qualquer timer anterior seja parado
          restTimerSeconds = durationSeconds;
          restTimerCountdown.textContent = formatTime(restTimerSeconds);
          stopRestTimerBtn.style.display = 'block'; // Mostra o botão de parar

          restTimerInterval = setInterval(() => {
              restTimerSeconds--;
              restTimerCountdown.textContent = formatTime(restTimerSeconds);

              if (restTimerSeconds <= 0) {
                  clearInterval(restTimerInterval);
                  alert('Tempo de descanso finalizado!');
                  stopRestTimerBtn.style.display = 'none';
                  restTimerCountdown.textContent = '00:00'; // Reseta para 00:00
              }
          }, 1000);
      }

      /**
       * Para o temporizador de descanso.
       */
      function stopRestTimer() {
          clearInterval(restTimerInterval);
          restTimerCountdown.textContent = '00:00'; // Reseta o display
          stopRestTimerBtn.style.display = 'none';
      }

      // --- Funções do Gráfico de Histórico ---

      /**
       * Atualiza ou cria o gráfico de histórico de treinos.
       */
      function updateWorkoutHistoryChart() {
          const ctx = document.getElementById('workoutHistoryChart').getContext('2d');

          if (workoutHistory.length === 0) {
              noHistoryMessage.style.display = 'block';
              if (workoutChart) {
                  workoutChart.destroy(); // Destrói o gráfico se não houver dados
                  workoutChart = null;
              }
              return;
          } else {
              noHistoryMessage.style.display = 'none';
          }

          // Prepara os dados para o Chart.js
          const labels = workoutHistory.map(entry => entry.date);
          const data = workoutHistory.map(entry => entry.duration / 60); // Convertendo para minutos

          if (workoutChart) {
              // Atualiza dados do gráfico existente
              workoutChart.data.labels = labels;
              workoutChart.data.datasets[0].data = data;
              workoutChart.update();
          } else {
              // Cria um novo gráfico se não existir
              workoutChart = new Chart(ctx, {
                  type: 'line',
                  data: {
                      labels: labels,
                      datasets: [{
                          label: 'Duração do Treino (minutos)',
                          data: data,
                          borderColor: var_primary_color, // Usar a variável CSS
                          backgroundColor: 'rgba(75, 192, 192, 0.2)',
                          tension: 0.3,
                          fill: true,
                          pointBackgroundColor: var_primary_color,
                          pointBorderColor: '#fff',
                          pointHoverBackgroundColor: '#fff',
                          pointHoverBorderColor: var_primary_color,
                      }]
                  },
                  options: {
                      responsive: true,
                      maintainAspectRatio: false,
                      plugins: {
                          title: {
                              display: true,
                              text: 'Histórico de Duração dos Treinos',
                              font: {
                                  size: 16,
                                  weight: 'bold'
                              },
                              color: var_text_color
                          },
                          tooltip: {
                              callbacks: {
                                  label: function(context) {
                                      const value = context.raw;
                                      const hours = Math.floor(value / 60);
                                      const minutes = Math.floor(value % 60);
                                      const seconds = Math.round((value - Math.floor(value)) * 60);
                                      return `Duração: ${hours}h ${minutes}min ${seconds}s`;
                                  }
                              }
                          }
                      },
                      scales: {
                          x: {
                              beginAtZero: true,
                              title: {
                                  display: true,
                                  text: 'Data',
                                  color: var_light_text_color
                              },
                              ticks: {
                                  color: var_light_text_color
                              }
                          },
                          y: {
                              beginAtZero: true,
                              title: {
                                  display: true,
                                  text: 'Duração (minutos)',
                                  color: var_light_text_color
                              },
                              ticks: {
                                  color: var_light_text_color
                              }
                          }
                      }
                  }
              });
          }
      }

      // --- Event Listeners ---

      // Botão Iniciar Treino
      startWorkoutBtn.addEventListener('click', startWorkout);

      // Botão Finalizar Treino
      endWorkoutBtn.addEventListener('click', endWorkout);

      // Botão Ativar Temporizador de Descanso
      startRestTimerBtn.addEventListener('click', () => {
          restTimerModal.classList.add('active');
      });

      // Botões de duração do descanso
      restDurationButtons.forEach(button => {
          button.addEventListener('click', (event) => {
              const duration = parseInt(event.target.dataset.duration);
              startRestTimer(duration);
          });
      });

      // Botão Parar Temporizador de Descanso
      stopRestTimerBtn.addEventListener('click', stopRestTimer);

      // Botão Fechar Modal de Descanso
      closeRestModalBtn.addEventListener('click', () => {
          restTimerModal.classList.remove('active');
          stopRestTimer(); // Garante que o timer pare ao fechar o modal
      });

      // Navegação
      navHomeBtn.addEventListener('click', () => showSection(homeSection, navHomeBtn));
      navWorkoutBtn.addEventListener('click', () => showSection(workoutSection, navWorkoutBtn));
      navHistoryBtn.addEventListener('click', () => showSection(historySection, navHistoryBtn));

      // Obtém as variáveis CSS para usar no JS (para o Chart.js)
      const style = getComputedStyle(document.body);
      const var_primary_color = style.getPropertyValue('--primary-color').trim();
      const var_text_color = style.getPropertyValue('--text-color').trim();
      const var_light_text_color = style.getPropertyValue('--light-text-color').trim();


      // Inicializa o aplicativo ao carregar a página
      document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
