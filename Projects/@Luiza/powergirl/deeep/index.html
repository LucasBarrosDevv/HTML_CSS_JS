<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitFem - Seu App Fitness</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .calendar {
            background-color: #1e1e1e;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .month {
            text-align: center;
            margin-bottom: 20px;
            color: #ff4081;
            font-size: 1.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            margin-bottom: 15px;
            color: #b0b0b0;
            font-weight: 500;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            text-align: center;
        }

        .day {
            padding: 10px 0;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .day:hover {
            background-color: #333333;
        }

        .today {
            background-color: #ff4081;
            color: white;
            font-weight: bold;
        }

        .workout-day {
            margin-top: 10px;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ff4081;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 64, 129, 0.3);
        }

        .start-button {
            background: linear-gradient(135deg, #ff4081 0%, #ff6699 100%);
            border: none;
            border-radius: 50px;
            color: white;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
            margin-top: 20px;
        }

        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 64, 129, 0.6);
        }

        .start-button:active {
            transform: translateY(1px);
        }

        .other-month {
            color: #555555;
        }

        @media (max-width: 480px) {
            .month {
                font-size: 1.3rem;
            }
            
            .workout-day {
                font-size: 1.5rem;
            }
            
            .start-button {
                padding: 15px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calendar">
            <div class="month" id="month"></div>
            <div class="weekdays" id="weekdays"></div>
            <div class="days" id="days"></div>
        </div>

        <div class="workout-day" id="workout-day"></div>

        <button class="start-button" id="start-button">Começar treino</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Elementos do DOM
            const monthElement = document.getElementById('month');
            const weekdaysElement = document.getElementById('weekdays');
            const daysElement = document.getElementById('days');
            const workoutDayElement = document.getElementById('workout-day');
            const startButton = document.getElementById('start-button');
            
            // Dias da semana abreviados
            const weekdays = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
            
            // Nomes dos dias da semana completos
            const fullWeekdays = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
            
            // Nomes dos meses
            const months = [
                'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
                'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
            ];
            
            // Data atual
            const currentDate = new Date();
            const currentYear = currentDate.getFullYear();
            const currentMonth = currentDate.getMonth();
            const currentDay = currentDate.getDate();
            const currentWeekday = currentDate.getDay();
            
            // Configurar o mês
            monthElement.textContent = months[currentMonth];
            
            // Configurar dias da semana
            weekdaysElement.innerHTML = weekdays.map(day => `<div>${day}</div>`).join('');
            
            // Obter primeiro dia do mês e último dia do mês
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();
            const lastDayPrevMonth = new Date(currentYear, currentMonth, 0).getDate();
            
            // Gerar dias do calendário
            let daysHtml = '';
            
            // Dias do mês anterior
            for (let i = 0; i < firstDay; i++) {
                daysHtml += `<div class="day other-month">${lastDayPrevMonth - firstDay + i + 1}</div>`;
            }
            
            // Dias do mês atual
            for (let i = 1; i <= lastDay; i++) {
                if (i === currentDay) {
                    daysHtml += `<div class="day today">${i}</div>`;
                } else {
                    daysHtml += `<div class="day">${i}</div>`;
                }
            }
            
            // Dias do próximo mês (para completar a grade)
            const totalCells = Math.ceil((firstDay + lastDay) / 7) * 7;
            const remainingDays = totalCells - (firstDay + lastDay);
            
            for (let i = 1; i <= remainingDays; i++) {
                daysHtml += `<div class="day other-month">${i}</div>`;
            }
            
            daysElement.innerHTML = daysHtml;
            
            // Configurar texto do dia de treino
            workoutDayElement.textContent = `Treino de ${fullWeekdays[currentWeekday]}`;
            
            // Configurar botão de começar treino
            startButton.addEventListener('click', function() {
                window.location.href = 'treino.html';
            });
        });
    </script>
</body>
</html>
