<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja da Luiza</title>
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/vendas.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="logo-area">
            <i class="fas fa-lock"></i>
            <div class="logo-text">
                <span>Loja</span>
                <span>da</span>
                <span>Luiza</span>
            </div>
        </div>
        <!-- Botão hamburger -->
        <div class="hamburger" id="hamburger">
            <i class="fas fa-bars"></i>
        </div>

        <nav class="menu" id="menu">
            <a href="#" class="menu-item active"><i class="fas fa-home"></i> Dashboard</a>
            <a href="#" class="menu-item"><i class="fas fa-cube"></i> Produtos</a>
            <a href="#" class="menu-item"><i class="fas fa-shopping-cart"></i> Vendas</a>
            <a href="#" class="menu-item"><i class="fas fa-chart-bar"></i> Relatórios</a>
            <a href="#" class="menu-item"><i class="fas fa-cog"></i> Admin</a>
        </nav>
        <!-- script -->
        <script src="scripts/header.js"></script>
    </header>
    <main>
        <section class="search-section">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Buscar produto...">
            </div>
            <div class="product-list">
                <!-- Lista de produtos (vazia para layout) -->
            </div>
        </section>

        <aside class="cart-section">
            <h2>Carrinho</h2>
            <p class="empty-cart">Carrinho vazio</p>

            <div class="cart-totals">
                <div class="subtotal">
                    <span>Subtotal:</span>
                    <span>R$ 0,00</span>
                </div>
                <div class="total">
                    <strong>Total:</strong>
                    <strong>R$ 0,00</strong>
                </div>
            </div>

            <div class="payment-method">
                <label for="payment">Forma de Pagamento:</label>
                <select id="payment">
                    <option>Dinheiro</option>
                    <option>Cartão de Crédito</option>
                    <option>Pix</option>
                </select>
            </div>

            <button class="finalize-btn"><i class="fas fa-check"></i> Finalizar Venda</button>
        </aside>
    </main>
    
</body>
</html>
