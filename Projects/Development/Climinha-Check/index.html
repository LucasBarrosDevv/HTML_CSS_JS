<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Climinha Check</title>
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="style/style-particles.css">
  <!-- Pré-conexão para otimizar carregamento das fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crafty+Girls&family=Love+Light&family=Sriracha&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Love+Light&family=Sriracha&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Cabeçalho principal da página -->
  <header>
    <h1>Climinha Check <br> &#127826;</h1>
  </header>
  <!-- Conteúdo principal da página -->
  <main>
    <!-- Subtítulo -->
    <h2 id="h2">
      Hoje Tem?&#127814;&#128166;
    </h2>

    <!-- Área dos botões de resposta -->
    <div id="check">
      <!-- Botão "Sim" com link para o WhatsApp -->
      <a href="">
        <button id="sim">Sim &#128293;</button>
      </a>

      <!-- Botão "Não" sem link -->
      <button id="nao">Não &#128148;</button>
    </div>
  </main>

  <!-- Canvas para partículas animadas no fundo -->
  <canvas id="canvas"></canvas>

  <!-- Scripts JS (animação de partículas e lógica principal) -->
  <script src="script/script-particles.js"></script>
  <script src="script/script.js"></script>
</body>

</html>
