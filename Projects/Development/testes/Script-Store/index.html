<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Script Store</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Inter&display=swap');

    body, html {
      margin: 0;
      padding: 0;
      border: none;
    }

    header {
      background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.6)), url('https://i.pinimg.com/736x/e0/5b/34/e05b341d9940ede7328c2690d42d5195.jpg');
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      font-family: Arial, Helvetica, sans-serif;
      height: 50vh;
      color: white;
    }

    header h1 {
      font-family: "Libre Baskerville", serif;
      margin: 0;
      padding-top: 5vh;
      text-align: center;
      font-size: 2.8em;
    }

    header button {
      display: block;
      background-color: black;
      margin: 15vh auto auto auto;
      padding: 5px 30px;
      border-radius: 7px;
      border: 2px solid rgb(0, 238, 255);
    }

    header button a {
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.5em;
    }

    main {
      background-color: #001429;
      height: 3000px;
    }

    figure {
      margin: 0;
      padding-top: 20px;
    }

    figure img {
      display: block;
      margin: auto;
      width: 200px;
      margin-bottom: 50px;
    }

    #vantagens {
      font-family: "Inter", sans-serif;
      color: white;
      font-weight: bold;
      font-size: 1.5em;
      text-align: center;
      line-height: 1.8;
      padding: 0 10vw;
      margin: 5vh auto 10vh auto;
    }

    .carrossel {
      background-color: #001F3D;  
      overflow: hidden;
      width: 100%;
      padding: 50px 0;
    }

    .carrossel-inner {
      display: flex;
      transition: transform 0.5s ease;
      gap: 20px;
      padding: 0 5vw;
    }

    .produto {
      background-color: #001F3D;
      flex: 0 0 60vw;
      height: 350px;
      border-radius: 10px;
      transition: all 0.4s ease;
      box-shadow: 1px 1px 11px 9px #00000061;
    }

    .produto.active {
      flex: 0 0 70vw;
      height: 400px;
      box-shadow: 0 0 25px #00f0ff;
      z-index: 2;
    }

    .produto:not(.active) {
      opacity: 0.5;
      transform: scale(0.9);
    }
  </style>
</head>
<body>

<header>
  <h1>
    <span style="color: rgb(0, 238, 255); margin-right: 60px;">Script</span><br>
    <span style="color: rgb(255, 102, 0); margin-left: 60px;">Store</span>
  </h1>
  <button><a href="">Dock</a></button>
</header>

<main>
  <figure>
    <img src="img/logo.png" alt="">
  </figure>

  <div>
    <p id="vantagens">
      Economize tempo e impressione seus amigos com <span style="color: rgb(0, 238, 255);">Scripts</span> <span style="color: rgb(255, 102, 0)">Prontos</span>, organizados e fáceis de usar no seu site ou aplicação.
    </p>
  </div>

  <section class="carrossel">
    <div class="carrossel-inner" id="carrosselInner">
      <div class="produto">
        <iframe src="" frameborder="0"></iframe>
      </div>
      <div class="produto"></div>
      <div class="produto"></div>
    </div>
  </section>
</main>

<script>
  const carrosselInner = document.getElementById("carrosselInner");
  const produtos = carrosselInner.children;
  let currentIndex = 0;
  const totalSlides = produtos.length;

  function updateSlide() {
    for (let i = 0; i < totalSlides; i++) {
      produtos[i].classList.remove("active");
    }
    produtos[currentIndex].classList.add("active");

    // calcular deslocamento: item ocupa 65vw (60vw + 5vw gap aprox)
    const offset = (currentIndex * -65) + 5;
    carrosselInner.style.transform = `translateX(${offset}vw)`;
  }

  function nextSlide() {
    currentIndex++;
    if (currentIndex >= totalSlides) currentIndex = 0;
    updateSlide();
  }

  // Troca slide automático a cada 4 segundos
  setInterval(nextSlide, 4000);

  // Inicia com o primeiro ativo
  updateSlide();
</script>

</body>
</html>
