<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Script Store</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Inter&display=swap");

      body,
      html {
        margin: 0;
        padding: 0;
        border: none;
      }

      header {
        background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.6)),
          url("https://i.pinimg.com/736x/e0/5b/34/e05b341d9940ede7328c2690d42d5195.jpg");
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        font-family: Arial, Helvetica, sans-serif;
        height: 50vh;
        color: white;
      }

      header h1 {
        font-family: "Libre Baskerville", serif;
        margin: 0;
        padding-top: 5vh;
        text-align: center;
        font-size: 2.8em;
      }

      header button {
        display: block;
        background-color: black;
        margin: 15vh auto auto auto;
        padding: 5px 30px;
        border-radius: 7px;
        border: 2px solid rgb(0, 238, 255);
      }

      header button a {
        color: white;
        text-decoration: none;
        font-weight: 700;
        font-size: 1.5em;
      }

      main {
        background-color: #001429;
        min-height: 100vh;
      }

      figure {
        margin: 0;
        padding-top: 20px;
      }

      #icon-html {
        display: block;
        margin: auto;
        width: 200px;
        margin-bottom: 50px;
      }

      #vantagens {
        font-family: "Inter", sans-serif;
        color: white;
        font-weight: bold;
        font-size: 1.5em;
        text-align: center;
        line-height: 1.8;
        padding: 0 10vw;
        margin: 5vh auto 10vh auto;
      }

      .container-responsivo {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #container-vantgens {
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      .img-vantagens {
        width: 100px;
      }
      .name-vantagens {
        color: white;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>
        <span style="color: rgb(0, 238, 255); margin-right: 60px">Script</span
        ><br />
        <span style="color: rgb(255, 102, 0); margin-left: 60px">Store</span>
      </h1>
      <button><a href="">Dock</a></button>
    </header>

    <main>
      <figure>
        <img id="icon-html" src="img/logo.png" alt="" />
      </figure>

      <div>
        <p id="vantagens">
          Economize tempo e impressione seus amigos com
          <span style="color: rgb(0, 238, 255)">Scripts</span>
          <span style="color: rgb(255, 102, 0)">Prontos</span>, organizados e
          fáceis de usar no seu site ou aplicação.
        </p>
      </div>
      <section id="container-vantgens">
        <figure>
          <img class="img-vantagens" src="img/copie-cole.png" alt="">
          <figcaption class="name-vantagens">Copie e Cole</figcaption>
        </figure>
        <figure>
          <img class="img-vantagens" src="img/monitorar-tablet-e-smartohone.png" alt="">
          <figcaption class="name-vantagens">Design Responsivo</figcaption>
        </figure>
        <figure>
          <img class="img-vantagens" src="img/Guia.png" alt="">
          <figcaption class="name-vantagens">Guia Completo</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
