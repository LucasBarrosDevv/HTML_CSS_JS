<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gerador de Links GitHub - Dark</title>
  <link rel="apple-touch-icon" sizes="180x180" href="icone-lik.jpeg" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      margin: 0;
      padding: 20px;
      color: #e0e0e0;
    }

    .container {
      max-width: 500px;
      margin: 50px auto;
      background: #1e1e1e;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #ffffff;
    }

    label {
      font-weight: bold;
      color: #cccccc;
    }

    textarea {
      width: 100%;
      height: 100px;
      margin-top: 8px;
      margin-bottom: 16px;
      padding: 10px;
      border: 1px solid #444;
      background-color: #2a2a2a;
      color: #fff;
      border-radius: 6px;
      resize: vertical;
      font-size: 16px;
    }

    button {
      display: block;
      width: 100%;
      padding: 12px;
      background: #2196f3;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1976d2;
    }

    #resultado {
      margin-top: 20px;
    }

    #linkGerado {
      word-break: break-all;
      display: inline-block;
      margin-top: 8px;
      color: #64b5f6;
    }

    #copyBtn {
      margin-top: 10px;
      padding: 8px 16px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #copyBtn:hover {
      background: #388e3c;
    }

    #preview {
      margin-top: 20px;
      display: none;
    }

    iframe {
      width: 100%;
      height: 300px;
      border: 1px solid #444;
      border-radius: 8px;
      background-color: #2a2a2a;
    }

    #status {
      margin-top: 10px;
      font-size: 14px;
      color: #bbbbbb;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Gerador de Links do GitHub</h1>

    <label for="pathInput">Insira o caminho:</label>
    <textarea id="pathInput" placeholder="https://lucasbarrosdevv.github.io/HTML_CSS_JS/"></textarea>

    <button onclick="gerarLink()">Gerar Link e Ver Prévia</button>

    <div id="resultado" style="display:none;">
      <p>Link Gerado:</p>
      <a href="#" target="_blank" id="linkGerado">---</a>
      <button id="copyBtn" onclick="copiarLink()">Copiar Link</button>
      <div id="status"></div>
    </div>

    <div id="preview">
      <p>Pré-visualização:</p>
      <iframe id="iframePreview"></iframe>
    </div>
  </div>

  <script>
   function gerarLink() {
  const input = document.getElementById("pathInput").value.trim();
  const linkBase = "https://lucasbarrosdevv.github.io/HTML_CSS_JS/";

  if (input === "") {
    alert("Por favor, insira um caminho.");
    return;
  }

  let pathCorrigido = input.replace(/https:\/\/lucasbarrosdevv\.github\.io\/HTML_CSS_JS\//g, "");
  pathCorrigido = pathCorrigido.replace(/\s+/g, "/");
  pathCorrigido = pathCorrigido.split("/").filter(p => p).join("/");

  // Verifica se termina com 'index.html', se não, adiciona barra no final
  let linkFinal = linkBase + pathCorrigido;
  if (!pathCorrigido.endsWith("index.html")) {
    // Se já tiver barra no final, não adiciona
    if (linkFinal.charAt(linkFinal.length - 1) !== "/") {
      linkFinal += "/";
    }
  }

  const linkElemento = document.getElementById("linkGerado");
  linkElemento.href = linkFinal;
  linkElemento.textContent = linkFinal;

  document.getElementById("resultado").style.display = "block";

  const iframe = document.getElementById("iframePreview");
  const previewDiv = document.getElementById("preview");
  const statusDiv = document.getElementById("status");

  previewDiv.style.display = "none";
  statusDiv.textContent = "Verificando link...";

  iframe.src = linkFinal;

  iframe.onload = function() {
    statusDiv.textContent = "Link encontrado!";
    previewDiv.style.display = "block";
  };

  iframe.onerror = function() {
    statusDiv.textContent = "Página não encontrada ou inacessível.";
    previewDiv.style.display = "none";
  };
}


    function copiarLink() {
      const link = document.getElementById("linkGerado").textContent;
      navigator.clipboard.writeText(link).then(() => {
        alert("Link copiado para a área de transferência!");
      }).catch(err => {
        alert("Não foi possível copiar o link.");
      });
    }
  </script>
</body>
</html>
