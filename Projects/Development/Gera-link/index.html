<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Visualizador GitHub Pages - Dark</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #121212;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
    }

    #iframePreview {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 0;
      background: #121212;
      display: none;
    }

    .container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 500px;
      background: rgba(30, 30, 30, 0.95);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      z-index: 1;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #ffffff;
    }

    label {
      font-weight: bold;
      color: #cccccc;
    }

    .link-input {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 26px;
      flex-wrap: wrap;
    }

    #prefixoLink {
      font-size: 14px;
      color: #aaaaaa;
      transition: color 0.3s;
      word-break: break-word;
    }

    #pathInput {
      flex: 1;
      padding: 10px;
      border: 1px solid #444;
      background-color: #2a2a2a;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
    }

    /* Resultado abaixo da container */
    #resultado {
      position: fixed;
      top: calc(50% + 200px);
      left: 50%;
      transform: translateX(-50%);
      max-width: 500px;
      background: rgba(30, 30, 30, 0.95);
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
      display: none;
      opacity: 0;
      transition: opacity 0.6s ease;
      z-index: 2;
    }

    #resultado.show {
      opacity: 1;
    }

    #linkGerado {
      word-break: break-all;
      display: inline-block;
      margin-top: 8px;
      color: #64b5f6;
      font-size: 14px;
    }

    #copyBtn {
      margin-left: 10px;
      padding: 6px 10px;
      background: #44444471;
      color: #bbb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 10px;
    }

    #copyBtn:hover {
      background: #555;
      color: #fff;
    }

    #status {
      margin-top: 10px;
      font-size: 13px;
      color: #bbbbbb;
    }

    /* Últimos acessos também fixo abaixo */
    #ultimosPaths {
      position: fixed;
      top: calc(50% + 300px);
      left: 50%;
      transform: translateX(-50%);
      max-width: 500px;
      background: rgba(20, 20, 20, 0.95);
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
      font-size: 12px;
      color: #999;
      display: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: 2;

      margin-top: 20px;
    }

    #ultimosPaths.show {
      display: block;
      opacity: 1;
    }

    #ultimosPaths button {
      background: #1e1e1e;
      border: 1px solid #333;
      color: #777;
      margin: 2px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }
    #ultimosPaths button:hover {
      background: #2a2a2a;
      color: #cccccce1;
    }
  </style>
</head>
<body>

  <iframe id="iframePreview"></iframe>

  <div class="container">
    <h1>Visualizador GitHub Pages</h1>
    <label for="pathInput">Insira o caminho:</label>
    <div class="link-input">
      <span id="prefixoLink">https://lucasbarrosdevv.github.io/HTML_CSS_JS/</span>
      <input type="text" id="pathInput" placeholder="pasta/pagina.html">
    </div>
    <div id="status"></div>
  </div>

  <!-- Resultado abaixo -->
  <div id="resultado">
    <a href="#" target="_blank" id="linkGerado">---</a>
    <button id="copyBtn" onclick="copiarLink()">Copiar</button>
  </div>

  <!-- Últimos acessos abaixo -->
  <div id="ultimosPaths"></div>

  <script>
    const pathInput = document.getElementById("pathInput");
    const prefixoLink = document.getElementById("prefixoLink");
    const iframe = document.getElementById("iframePreview");
    const linkElemento = document.getElementById("linkGerado");
    const resultado = document.getElementById("resultado");
    const statusDiv = document.getElementById("status");
    const ultimosPathsDiv = document.getElementById("ultimosPaths");

    const linkBase = "https://lucasbarrosdevv.github.io/HTML_CSS_JS/";
    const maxHistorico = 5;

    let ultimosTimeout;

    function atualizarHistorico(path) {
      let historico = JSON.parse(localStorage.getItem("historicoPaths")) || [];
      historico = historico.filter(item => item !== path);
      historico.unshift(path);
      if (historico.length > maxHistorico) historico.pop();
      localStorage.setItem("historicoPaths", JSON.stringify(historico));
      mostrarHistorico();
    }

    function mostrarHistorico() {
      let historico = JSON.parse(localStorage.getItem("historicoPaths")) || [];
      if (historico.length === 0) {
        ultimosPathsDiv.innerHTML = "";
        return;
      }
      ultimosPathsDiv.innerHTML = "<div style='margin-bottom:4px;'>Últimos acessos:</div>";
      historico.forEach(item => {
        const parts = item.split('/');
        let penultimo = parts.length >= 2 ? parts[parts.length - 2] : "(sem pasta)";
        let ultimo = parts.length >= 1 ? parts[parts.length - 1] : "(arquivo)";
        if (ultimo === "") ultimo = "(index)";
        const textoBotao = `${penultimo}/${ultimo}`;
        const btn = document.createElement("button");
        btn.textContent = textoBotao;
        btn.title = item;
        btn.onclick = () => {
          pathInput.value = item;
          pathInput.dispatchEvent(new Event("input"));
        };
        ultimosPathsDiv.appendChild(btn);
      });
    }

    pathInput.addEventListener("input", () => {
      let path = pathInput.value.trim();
      path = path.replace(/\s+/g, "/").split("/").filter(p => p).join("/");

      let linkFinal = linkBase + path;
      resultado.style.display = "none";
      resultado.classList.remove("show");
      ultimosPathsDiv.classList.remove("show");
      ultimosPathsDiv.style.display = "none";
      clearTimeout(ultimosTimeout);

      if (path === "") {
        prefixoLink.style.color = "#aaaaaa";
        iframe.style.display = "none";
        statusDiv.textContent = "";
        return;
      }

      statusDiv.textContent = "Verificando...";

      fetch(linkFinal, { method: 'HEAD' })
        .then(response => {
          if (response.ok) {
            prefixoLink.style.color = "#4CAF50";
            statusDiv.textContent = "Página encontrada!";
            linkElemento.href = linkFinal;
            linkElemento.textContent = linkFinal;
            resultado.style.display = "block";
            iframe.src = linkFinal;
            iframe.style.display = "block";
            resultado.classList.add("show");
            atualizarHistorico(path);
            ultimosTimeout = setTimeout(() => {
              ultimosPathsDiv.style.display = "block";
              ultimosPathsDiv.classList.add("show");
            }, 7000);
          } else {
            prefixoLink.style.color = "#f44336";
            statusDiv.textContent = "Página não encontrada.";
            iframe.style.display = "none";
          }
        })
        .catch(() => {
          prefixoLink.style.color = "#f44336";
          statusDiv.textContent = "Página não encontrada.";
          iframe.style.display = "none";
        });
    });

    function copiarLink() {
      const link = linkElemento.textContent;
      navigator.clipboard.writeText(link).then(() => {
        alert("Link copiado!");
      }).catch(() => {
        alert("Não foi possível copiar.");
      });
    }

    mostrarHistorico();
  </script>
</body>
</html>
