<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Visualizador GitHub Pages - Dark</title>
  <style>
    html, body {
      
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #121212;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }
    body.iframe-active #iframePreview {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.5s;
    }
    #iframePreview {
      position: absolute;
      top: -9999px;
      left: -9999px;
      width: 0;
      height: 0;
      border: none;
      z-index: 0;
      background: #121212;
    }
    .container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 500px;
      width: 90%;
      background: rgba(30, 30, 30, 0.95);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      z-index: 1;
      box-sizing: border-box;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #ffffff;
      font-size: 24px;
    }
    label {
      font-weight: bold;
      color: #cccccc;
      display: block;
      margin-bottom: 6px;
    }
    .link-input {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 26px;
      flex-wrap: wrap;
      word-break: break-word;
    }
    #prefixoLink {
      font-size: 14px;
      color: #aaaaaa;
      transition: color 0.3s;
      word-break: break-word;
    }
    #pathInput {
      flex: 1;
      font-size: 16px;
      padding: 10px;
      border: 1px solid #444;
      background-color: #2a2a2a;
      color: #fff;
      border-radius: 6px;
      min-width: 0;
    }
    #resultado {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 500px;
      width: 90%;
      background: rgba(30, 30, 30, 0.95);
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
      display: none;
      opacity: 0;
      transition: opacity 0.6s ease;
      z-index: 2;
      word-break: break-word;
    }
    #resultado.show {
      opacity: 1;
    }
    #linkGerado {
      word-break: break-word;
      display: block;
      margin-top: 8px;
      color: #64b5f6;
      font-size: 14px;
    }
    #copyBtn {
      margin-top: 10px;
      padding: 6px 10px;
      background: #44444471;
      color: #bbb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    #copyBtn:hover {
      background: #555;
      color: #fff;
    }
    #status {
      margin-top: 10px;
      font-size: 13px;
      color: #bbbbbb;
    }
    #toggleHistorico {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 5;
      padding: 8px 12px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 6px;
      color: #ccc;
      font-size: 12px;
      cursor: pointer;
    }
    #toggleHistorico:hover {
      background: #333;
      color: #fff;
    }
    #ultimosPaths {
      position: fixed;
      top: 50px;
      left: 0;
      width: 100%;
      background: rgba(20, 20, 20, 0.98);
      padding: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      display: none;
      z-index: 4;
      overflow-x: auto;
      white-space: nowrap;
    }
    #ultimosPaths button {
      background: #1e1e1e;
      border: 1px solid #333;
      color: #ccc;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      margin-right: 6px;
      flex-shrink: 0;
    }
    #ultimosPaths button:hover {
      background: #333;
      color: #fff;
    }
    @media (max-width: 480px) {
      h1 { font-size: 20px; }
      #pathInput { font-size: 16px; padding: 8px; }
      #copyBtn { font-size: 16px; padding: 5px 8px; }
      #prefixoLink { font-size: 14px; }
      #toggleHistorico { font-size: 16px; padding: 6px 10px; }
      #ultimosPaths button { font-size: 14px; }
    }
  </style>
</head>
<body>

<iframe id="iframePreview"></iframe>

<button id="toggleHistorico">Histórico</button>
<div id="ultimosPaths"></div>

<div class="container">
  <h1>Visualizador GitHub Pages</h1>
  <label for="pathInput">Insira o caminho:</label>
  <div class="link-input">
    <span id="prefixoLink">https://lucasbarrosdevv.github.io/HTML_CSS_JS/</span>
    <input type="text" id="pathInput" placeholder="pasta/pagina.html">
  </div>
  <div id="status"></div>
</div>

<div id="resultado">
  <a href="#" target="_blank" id="linkGerado">---</a>
  <button id="copyBtn" onclick="copiarLink()">Copiar</button>
</div>

<script>
const pathInput = document.getElementById("pathInput");
const prefixoLink = document.getElementById("prefixoLink");
const iframe = document.getElementById("iframePreview");
const linkElemento = document.getElementById("linkGerado");
const resultado = document.getElementById("resultado");
const statusDiv = document.getElementById("status");
const ultimosPathsDiv = document.getElementById("ultimosPaths");
const toggleBtn = document.getElementById("toggleHistorico");

const linkBase = "https://lucasbarrosdevv.github.io/HTML_CSS_JS/";
const maxHistorico = 10;

function atualizarHistorico(path) {
  let historico = JSON.parse(localStorage.getItem("historicoPaths")) || [];
  historico = historico.filter(item => item !== path);
  historico.unshift(path);
  if (historico.length > maxHistorico) historico.pop();
  localStorage.setItem("historicoPaths", JSON.stringify(historico));
  mostrarHistorico();
}

function mostrarHistorico() {
  let historico = JSON.parse(localStorage.getItem("historicoPaths")) || [];
  ultimosPathsDiv.innerHTML = "";
  if (historico.length === 0) return;
  historico.forEach(item => {
    const parts = item.split('/');
    let penultimo = parts.length >= 2 ? parts[parts.length - 2] : "(sem pasta)";
    let ultimo = parts.length >= 1 ? parts[parts.length - 1] : "(index)";
    if (ultimo === "") ultimo = "(index)";
    const textoBotao = `${penultimo}/${ultimo}`;
    const btn = document.createElement("button");
    btn.textContent = textoBotao;
    btn.title = item;
    btn.onclick = () => {
      pathInput.value = item;
      pathInput.dispatchEvent(new Event("input"));
    };
    ultimosPathsDiv.appendChild(btn);
  });
}

function verificarLink(link, callback) {
  fetch(link, { method: 'HEAD' })
    .then(response => {
      if (response.ok) {
        iframe.src = link;
        callback(true, link);
      } else {
        callback(false, link);
      }
    })
    .catch(() => callback(false, link));
}


pathInput.addEventListener("input", () => {
  let path = pathInput.value.trim();
  path = path.replace(/\s+/g, "/").split("/").filter(p => p).join("/");

  let linkFinal = linkBase + path;
  resultado.style.display = "none";
  resultado.classList.remove("show");
  document.body.classList.remove("iframe-active");

  if (path === "") {
    prefixoLink.style.color = "#aaaaaa";
    statusDiv.textContent = "";
    return;
  }

  statusDiv.textContent = "Verificando...";

  verificarLink(linkFinal, (encontrado, linkUsado) => {
    if (encontrado) {
      document.body.classList.add("iframe-active");
      prefixoLink.style.color = "#4CAF50";
      statusDiv.textContent = "Página encontrada!";
      linkElemento.href = linkUsado;
      linkElemento.textContent = linkUsado;
      resultado.style.display = "block";
      resultado.classList.add("show");
      atualizarHistorico(path);
    } else {
      if (!path.endsWith(".html")) {
        let linkComHtml = linkBase + path + ".html";
        verificarLink(linkComHtml, (encontrado2, linkUsado2) => {
          if (encontrado2) {
            document.body.classList.add("iframe-active");
            prefixoLink.style.color = "#4CAF50";
            statusDiv.textContent = "Página encontrada!";
            linkElemento.href = linkUsado2;
            linkElemento.textContent = linkUsado2;
            resultado.style.display = "block";
            resultado.classList.add("show");
            atualizarHistorico(path + ".html");
          } else {
            prefixoLink.style.color = "#f44336";
            statusDiv.textContent = "Página não encontrada.";
            document.body.classList.remove("iframe-active");
          }
        });
      } else {
        prefixoLink.style.color = "#f44336";
        statusDiv.textContent = "Página não encontrada.";
        document.body.classList.remove("iframe-active");
      }
    }
  });
});

function copiarLink() {
  const link = linkElemento.textContent;
  navigator.clipboard.writeText(link).then(() => {
    alert("Link copiado!");
  });
}

toggleBtn.addEventListener("click", () => {
  ultimosPathsDiv.style.display = ultimosPathsDiv.style.display === "block" ? "none" : "block";
});

mostrarHistorico();
</script>
</body>
</html>
