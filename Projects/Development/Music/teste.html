<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play-Music</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: black;
      color: white;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    #Play-Music {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90vw;
    }
    #icone {
      background-color: rgb(47, 47, 48);
      height: auto;
      min-height: 250px;
      width: 100%;
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    #icone img, #icone video {
      max-width: 100%;
      max-height: 100%;
      border-radius: 15px;
    }

    .loader {
      border: 6px solid #444;
      border-top: 6px solid #00ffcc;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .nome-artista, .nome-musica {
      font-style: italic;
      font-size: 1.5em;
      margin: 10px 0;
    }
    hr {
      border: 0.5px solid #888;
      width: 80%;
    }
    .progress-bar {
      width: 80%;
      height: 5px;
      background-color: #333;
      margin: 10px auto;
      border-radius: 5px;
      overflow: hidden;
    }
    .progress {
      width: 0%;
      height: 100%;
      background-color: #00ffcc;
    }
    .botoes {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .botoes img {
      height: 40px;
      cursor: pointer;
    }
    #pause {
      display: none;
    }
    input[type="text"] {
      width: 60%;
      padding: 10px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 15px;
      font-size: 1rem;
      margin-left: 10px;
      background: #00cc66;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #00994d;
    }
    .error {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- ✅ Input + botão colar -->
  <div>
    <input id="ytLink" type="text" placeholder="Cole o link aqui" />
    <button onclick="pasteFromClipboard()">Colar</button>
    <button onclick="playVideo()">Tocar Vídeo</button>
    <div id="error" class="error"></div>
  </div>

  <!-- ✅ Container principal -->
  <div id="Play-Music">
    <div id="icone">
      <!-- thumbnail, loader ou vídeo serão inseridos aqui -->
    </div>

    <!-- Nome do artista e música -->
    <p class="nome-artista" id="artist">Artista</p>
    <p class="nome-musica" id="music">Música</p>

    <hr> <!-- linha fina -->

    <!-- ✅ Barra de progresso -->
    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>

    <!-- ✅ Botões de controle -->
    <div class="botoes">
      <img src="icones/back.png" alt="voltar">
      <img id="play" src="icones/play.png" alt="play" onclick="playVideoElement()">
      <img id="pause" src="icones/pause.png" alt="pause" onclick="pauseVideoElement()">
      <img src="icones/next.png" alt="avançar">
    </div>
  </div>

  <script>
    let videoEl = null;

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('ytLink').value = text;
      } catch (err) {
        alert('Erro ao acessar a área de transferência.');
      }
    }

    async function playVideo() {
      const urlInput = document.getElementById('ytLink');
      const playerContainer = document.getElementById('icone');
      const errorDiv = document.getElementById('error');
      const artistEl = document.getElementById('artist');
      const musicEl = document.getElementById('music');

      errorDiv.textContent = '';
      playerContainer.innerHTML = '';

      const url = urlInput.value.trim();
      if (!url) {
        errorDiv.textContent = 'Por favor, cole um link válido do YouTube.';
        return;
      }

      // Exibe loader
      const loader = document.createElement('div');
      loader.className = 'loader';
      playerContainer.appendChild(loader);

      try {
        const response = await fetch('https://flask-backend-w585.onrender.com/get_video', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        if (!response.ok) throw new Error('Erro ao consultar o backend');

        const data = await response.json();
        playerContainer.innerHTML = ''; // Limpa loader

        if (data.stream_url && data.thumbnail) {
          // Exibe thumbnail antes do vídeo
          const thumb = document.createElement('img');
          thumb.src = data.thumbnail;
          thumb.alt = "Thumbnail do vídeo";
          playerContainer.appendChild(thumb);

          // Atualiza nome da música e artista
          musicEl.textContent = data.title || 'Música Desconhecida';
          artistEl.textContent = 'Artista Desconhecido';

          // Aguarda 1 segundo e troca por vídeo
          setTimeout(() => {
            playerContainer.innerHTML = '';
            videoEl = document.createElement('video');
            videoEl.src = data.stream_url;
            videoEl.controls = false;
            videoEl.autoplay = true;
            videoEl.id = "video-player";
            playerContainer.appendChild(videoEl);

            document.getElementById('play').style.display = 'none';
            document.getElementById('pause').style.display = 'inline';

            videoEl.addEventListener('timeupdate', () => {
              const progress = document.getElementById('progress');
              const percent = (videoEl.currentTime / videoEl.duration) * 100;
              progress.style.width = percent + '%';
            });

            videoEl.addEventListener('ended', () => {
              document.getElementById('play').style.display = 'inline';
              document.getElementById('pause').style.display = 'none';
            });
          }, 1000);

        } else {
          errorDiv.textContent = 'Não foi possível obter a URL do vídeo.';
        }
      } catch (err) {
        playerContainer.innerHTML = '';
        errorDiv.textContent = 'Erro: ' + err.message;
      }
    }

    function playVideoElement() {
      if (videoEl) {
        videoEl.play();
        document.getElementById('play').style.display = 'none';
        document.getElementById('pause').style.display = 'inline';
      }
    }

    function pauseVideoElement() {
      if (videoEl) {
        videoEl.pause();
        document.getElementById('play').style.display = 'inline';
        document.getElementById('pause').style.display = 'none';
      }
    }
  </script>
</body>
</html>
