<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Effect</title>
    <style>
        body {
            background-color: #001429;
            margin: 0;
        }

        .titulo-cod {
            color: white;
            text-align: center;
            padding: 30px 0 10px;
        }

        .bloco {
            height: 400px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
        }

        #bloco-1 {
            background-image:  url('img/Chuva-Binaria.png');
        }

        #bloco-2 {
            background-image: url('img/CHuva-Te-Amo.png');
        }

        #bloco-3 {
            background-image: url('img/particulas.png');
        }

        .container {
            color: white;
            border-radius: 10px;
            padding: 20px;
        }

        .bloco section {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .bloco section a {
            text-decoration: none;
            color: #fff;
            padding: 10px 20px;
            margin: 0 5px;
            border: 1px solid white;
            border-radius: 5px;
            transition: background 0.3s, color 0.3s;
            display: inline-block;
        }

        .bloco section a:hover {
            background: white;
            color: #001429;
        }
    </style>
</head>
<body>

    <section class="container">
        <h1 class="titulo-cod">Chuva Binária</h1>
        <div class="bloco" id="bloco-1">
            <section>
                <a href="#">Baixar</a>
                <a href="#">Descrição</a>
                <a href="#">Visualizar</a>
            </section>
        </div>

        <h1 class="titulo-cod">Chuva de Amor</h1>
        <div class="bloco" id="bloco-2">
            <section>
                <a href="#">Baixar</a>
                <a href="#">Descrição</a>
                <a href="#">Visualizar</a>
            </section>
        </div>

        <h1 class="titulo-cod">Partículas</h1>
        <div class="bloco" id="bloco-3">
            <section>
                <a href="#">Baixar</a>
                <a href="#">Descrição</a>
                <a href="#">Visualizar</a>
            </section>
        </div>
    </section>

</body>
</html>
