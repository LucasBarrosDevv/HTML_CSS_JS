<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Climinha Check</title>
  <style>
    @charset "UTF-8";

    /* Estilos do arquivo style.css e style-particles.css unidos */
    body {
      background-image: linear-gradient(to bottom, #e83d6e 0%, #c5033a 70%);
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    
    header > h1 {
      font-family: "Sriracha", cursive;
      font-size: 2.5em;
      text-align: center;
      color: white;
      text-shadow: 1px 10px 20px rgba(0, 0, 0, 0.436);
      margin-bottom: 0;
    }

    #icone {
      text-align: center;
      font-size: 2.5em;
      margin-top: 0;
    }

    main {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    
    #h2 {
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      font-size: 1.4em;
      text-shadow: 1px 0px 20px black;
    }
    
    #check {
      display: flex;
      justify-content: center;
      gap: 20px;
      width: 100%;
    }
    
    #sim, #nao {
      font-size: 1.2em;
      padding: 10px 20px;
      color: white;
      border-radius: 7px;
      cursor: pointer;
      border: none;
      white-space: nowrap;
    }
    
    #sim {
      background-color: rgba(0, 255, 17, 0.327);
      border: 2px solid rgb(0, 255, 17);  
      box-shadow: 0px 1px 19px 0px rgb(0, 255, 17);
    }
    
    #sim:active {
      animation: pulo 0.3s ease;
    }
    
    @keyframes pulo {
      0% { transform: translateY(0); }
      30% { transform: translateY(-20px); }
      50% { transform: translateY(0); }
      70% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }
    
    #nao {
      background-color: rgba(255, 0, 0, 0.177);
      border: 2px solid rgb(255, 0, 0);
      box-shadow: 0px 1px 19px 0px rgb(255, 0, 0);
      transition: top 0.5s ease, left 0.5s ease, transform 0.5s ease;
    }
    
    .foguinho {
      position: fixed;
      font-size: 2em;
      animation: subir 2s linear forwards;
      pointer-events: none;
      z-index: 9999;
    }
    
    @keyframes subir {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-100vh);
      }
    }
    
    .explosao {
      position: absolute;
      font-size: 2em;
      animation: explodir 0.8s linear forwards;
      pointer-events: none;
      z-index: 9999;
    }
    
    @keyframes explodir {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--x), var(--y)) scale(0.5);
      }
    }

    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      opacity: 0.5;
    }

    /* Otimizações para telas pequenas */
    @media (max-width: 600px) {
        header > h1 {
            font-size: 2em;
        }
        #h2 {
            font-size: 1.2em;
        }
        #sim, #nao {
            font-size: 1em;
            padding: 8px 15px;
        }
       
       
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sriracha&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Climinha Check </h1>
    <p id="icone">&#127826;</p>
  </header>
  <main>
    <h2 id="h2">
      Hoje Tem?&#127814;&#128166;
    </h2>
    <div id="check">
      <a href="https://wa.me/5599999999999?text=Hoje%20tem!!!%20Seu%20gostoso.%20kkkk%20(Vim%20do%20CliminhaCheck)">
        <button id="sim">Sim &#128293;</button>
      </a>
      <button id="nao">Não &#128148;</button>
    </div>
  </main>
  
  <canvas id="canvas"></canvas>

  <script>
    // Código do script.js
    const btnSim = document.getElementById("sim");
    const linkSim = btnSim.parentElement;
    let foguinhosAtivos = false;

    function criarExplosao() {
      const fogo = document.createElement("div");
      fogo.classList.add("explosao");
      fogo.textContent = "🔥🥵🍆💦";
      const rect = btnSim.getBoundingClientRect();
      fogo.style.left = rect.left + rect.width / 2 + "px";
      fogo.style.top = rect.top + rect.height / 2 + "px";
      const offsetX = (Math.random() - 0.5) * 200 + "px";
      const offsetY = (Math.random() - 0.5) * 200 + "px";
      fogo.style.setProperty("--x", offsetX);
      fogo.style.setProperty("--y", offsetY);
      document.body.appendChild(fogo);
      setTimeout(() => fogo.remove(), 800);
    }

    function criarFoguinho() {
      const fogo = document.createElement("div");
      fogo.classList.add("foguinho");
      fogo.textContent = "🔥";
      fogo.style.left = Math.random() * 100 + "vw";
      fogo.style.top = Math.random() * 100 + "vh";
      fogo.style.fontSize = Math.random() * 20 + 20 + "px";
      document.body.appendChild(fogo);
      setTimeout(() => fogo.remove(), 2000);
    }

    btnSim.addEventListener("click", (e) => {
      e.preventDefault();
      for (let i = 0; i < 20; i++) {
        criarExplosao();
      }
      if (!foguinhosAtivos) {
        foguinhosAtivos = true;
        setInterval(criarFoguinho, 150);
      }
      setTimeout(() => {
        window.location.href = linkSim.href;
      }, 2500);
    });

    const btnNao = document.getElementById("nao");
    let primeiroClique = true;

    btnNao.addEventListener("click", () => {
      moverBotao();
    });

    btnNao.addEventListener("mouseover", () => {
        // Ativa a função de mover apenas em telas maiores
        if (window.innerWidth > 600) {
            moverBotao();
        }
    });

    function moverBotao() {
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;
      const botaoWidth = btnNao.offsetWidth;
      const botaoHeight = btnNao.offsetHeight;
      const margem = 30;
      const maxX = viewportWidth - botaoWidth - margem;
      const maxY = viewportHeight - botaoHeight - margem;
      const minX = margem;
      const minY = margem;

      if (primeiroClique) {
        btnNao.style.position = "fixed";
        btnNao.style.top = btnNao.offsetTop + 70 + "px";
        btnNao.style.left = btnNao.offsetLeft + "px";
        primeiroClique = false;
      } else {
        const aleatorioX = Math.floor(Math.random() * (maxX - minX) + minX);
        const aleatorioY = Math.floor(Math.random() * (maxY - minY) + minY);
        const movimentoExtraX = (Math.random() - 0.5) * 100;
        const movimentoExtraY = (Math.random() - 0.5) * 100;
        btnNao.style.left = `${Math.min(Math.max(aleatorioX + movimentoExtraX, minX), maxX)}px`;
        btnNao.style.top = `${Math.min(Math.max(aleatorioY + movimentoExtraY, minY), maxY)}px`;
      }
    }
    
    // Código do script-particles.js
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    if (canvas) {
        // Definindo o tamanho do canvas para ocupar a tela toda
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Função para atualizar o tamanho caso a janela seja redimensionada
        window.addEventListener("resize", () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        });

        // Criando partículas
        const numParticles = 100;
        const particles = [];

        for (let i = 0; i < numParticles; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 3 + 1,
            dx: (Math.random() - 0.5) * 1.5,
            dy: (Math.random() - 0.5) * 1.5
          });
        }

        // Função para desenhar as partículas
        function drawParticles() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "white";

          particles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();

            p.x += p.dx;
            p.y += p.dy;

            // Fazer as partículas voltarem para a tela ao saírem
            if (p.x < 0) p.x = canvas.width;
            if (p.x > canvas.width) p.x = 0;
            if (p.y < 0) p.y = canvas.height;
            if (p.y > canvas.height) p.y = 0;
          });
        }

        // Função de animação
        function animate() {
          drawParticles();
          requestAnimationFrame(animate);
        }

        animate();
    }
  </script>
</body>
</html>
