<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📈 Estatísticas Avançadas</title>
    <link rel="stylesheet" href="historico.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 class="header-title">📈 Estatísticas Avançadas</h1>
            <a href="index.html" class="back-btn">⬅️ Voltar</a>
        </div>

        <!-- Period Filters -->
        <div class="filter-section">
            <div class="filter-title">🗓️ Filtrar Período</div>
            <div class="filter-buttons">
                <button class="filter-btn" data-period="today">Hoje</button>
                <button class="filter-btn active" data-period="week">Últimos 7 dias</button>
                <button class="filter-btn" data-period="month">Últimos 30 dias</button>
                <button class="filter-btn" data-period="year">Ano</button>
                <button class="filter-btn" data-period="custom">Personalizado</button>
            </div>
            <div class="custom-range hidden" id="custom-range">
                <input type="date" id="start-date">
                <input type="date" id="end-date">
                <button class="filter-btn">Aplicar</button>
            </div>
        </div>

        <!-- Dashboard Summary Cards -->
        <div class="dashboard-cards" id="dashboard-cards"></div>

        <!-- Earnings Chart -->
        <div class="chart-section">
            <div class="chart-header">
                <div class="chart-title">💰 Gráfico de Ganhos</div>
                <div class="chart-controls">
                    <button class="chart-toggle active" data-chart="earnings" data-type="bar">Barras</button>
                    <button class="chart-toggle" data-chart="earnings" data-type="line">Linha</button>
                    <button class="chart-toggle active" data-chart="earnings" data-mode="gross">Bruto</button>
                    <button class="chart-toggle" data-chart="earnings" data-mode="net">Líquido</button>
                </div>
            </div>
            <div class="chart-container" id="earnings-chart"></div>
        </div>

        <!-- Rides Count Chart -->
        <div class="chart-section">
            <div class="chart-header">
                <div class="chart-title">🚗 Número de Corridas</div>
            </div>
            <div class="chart-container" id="rides-chart"></div>
        </div>

        <!-- Distance Chart -->
        <div class="chart-section">
            <div class="chart-header">
                <div class="chart-title">📏 Distância Percorrida</div>
            </div>
            <div class="chart-container" id="distance-chart"></div>
        </div>

        <!-- Intelligent Insights -->
        <div class="chart-section">
            <div class="chart-title">🧠 Análise Inteligente</div>
            <div class="insights-grid" id="insights-grid"></div>
        </div>

        <!-- Comparison Module -->
        <div class="chart-section">
            <div class="chart-title">🔄 Comparações</div>
            <div class="comparison-grid" id="comparison-grid"></div>
        </div>

        <!-- Categories Module -->
        <div class="chart-section">
            <div class="chart-title">🏷️ Categorias de Corridas</div>
            <div class="category-grid" id="category-grid"></div>
        </div>

        <!-- Real KM Module -->
        <div class="chart-section">
            <div class="chart-title">⛽ Análise de KM Real vs KM Pagos</div>
            <div class="insights-grid" id="km-analysis"></div>
            <div class="chart-container" id="km-chart"></div>
        </div>

        <!-- Driver Statistics (Heatmap) -->
        <div class="chart-section">
            <div class="chart-title">⏰ Melhor Desempenho por Horário</div>
            <div class="heatmap" id="heatmap"></div>
        </div>

        <!-- Goals System -->
        <div class="goals-section">
            <div class="chart-title">🎯 Metas</div>
            <div id="goals-container"></div>
        </div>

        <!-- Detailed Ride History -->
        <div class="ride-list">
            <div class="chart-title">📄 Histórico Detalhado</div>
            <div id="ride-list-container"></div>
        </div>

        <!-- Export Reports -->
        <div class="export-section">
            <div class="chart-title">📑 Exportar Relatórios</div>
            <div class="export-buttons">
                <button class="export-btn" onclick="exportPDF('full')">📊 Relatório Completo</button>
                <button class="export-btn" onclick="exportPDF('daily')">📅 Relatório Diário</button>
                <button class="export-btn" onclick="exportPDF('weekly')">📈 Relatório Semanal</button>
                <button class="export-btn" onclick="exportPDF('monthly')">📆 Relatório Mensal</button>
            </div>
        </div>
    </div>

    <script src="historico.js"></script>
</body>
</html>
