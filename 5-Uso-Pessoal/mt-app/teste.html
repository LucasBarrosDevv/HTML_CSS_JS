<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>App Corridas Premium</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <div id="calculo-section" class="hidden">
        <div class="calculo-box">
            <div class="calculo-titulo">💰 Ganho por Quilômetro</div>
            <div class="calculo-resultado" id="preco-por-km">R$ 0,00</div>
            <div class="calculo-info" id="calculo-detalhes"></div>
        </div>
    </div>

    <!-- New section for pickup distance -->
    <div id="pickup-section">
        <h2 class="section-title">🚗 Distância até o Passageiro</h2>
        <div id="pickup-grid" class="grid"></div>
        <button id="mostrar-mais-pickup" class="button">Ver Mais Opções</button>
        <div id="pickup-manual-box" class="input-box hidden">
            <input id="pickup-manual" type="number" step="0.1" placeholder="Digite distância personalizada (km)" />
            <button id="pickup-manual-confirm" class="button manual-confirm-btn">Confirmar</button>
        </div>
    </div>

    <!-- Updated trip distance section -->
    <div id="km-section" class="hidden">
        <h2 class="section-title">📍 Distância da Corrida</h2>
        <div id="km-grid" class="grid"></div>
        <button id="mostrar-mais-km" class="button">Ver Mais Opções</button>
        <div id="km-manual-box" class="input-box hidden">
            <input id="km-manual" type="number" step="0.1" placeholder="Digite KM personalizado" />
            <button id="km-manual-confirm" class="button manual-confirm-btn">Confirmar</button>
        </div>
        <button id="voltar-pickup-btn" class="button voltar-btn">Voltar para Distância de Busca</button>
    </div>

    <div id="valor-section" class="hidden">
        <h2 class="section-title">💵 Selecione o Valor da Corrida</h2>
        <div id="valor-grid" class="grid"></div>
        <div id="valor-manual-box" class="input-box hidden">
            <input id="valor-manual" type="number" step="0.5" placeholder="Digite valor personalizado" />
        </div>
        <button id="valor-manual-btn" class="button hidden">Valor Personalizado</button>
        <button id="voltar-km-btn" class="button voltar-btn">Voltar para KM da Corrida</button>
    </div>

    <!-- Added fuel cost configuration section -->
    <div id="config-section" class="hidden">
        <div class="config-box">
            <h2 class="section-title">⚙️ Configurações de Custos</h2>
            
            <div class="config-field">
                <label for="gas-price">⛽ Preço da Gasolina (R$/litro)</label>
                <input id="gas-price" type="number" step="0.01" placeholder="Ex: 5.50" />
            </div>
            
            <div class="config-field">
                <label for="fuel-avg">🚗 Média do Veículo (km/litro)</label>
                <input id="fuel-avg" type="number" step="0.1" placeholder="Ex: 12.5" />
            </div>
            
            <div class="config-field">
                <label for="total-km">📏 Total KM Real Rodados (manual)</label>
                <input id="total-km" type="number" step="0.1" placeholder="Ex: 150.5" />
            </div>
            
            <div class="config-field">
                <label for="app-fee">💳 Taxa do Aplicativo (R$)</label>
                <input id="app-fee" type="number" step="0.01" placeholder="Ex: 5.00" />
            </div>
            
            <button id="save-config" class="button">Salvar Configurações</button>
        </div>
    </div>

    <div id="historico-section" class="hidden">
        <div class="historico-section">
            <div class="historico-title">Histórico de Corridas</div>
            
            <!-- Added config button and total km display -->
            <div class="historico-header-actions">
                <button id="config-btn" class="button config-btn">⚙️ Configurar Custos</button>
                <div class="total-km-display main-km">
                    <span class="total-km-label">📏 Total KM Real:</span>
                    <span class="total-km-value" id="total-real-km">0.0 km</span>
                    <div class="km-controls">
                        <button id="edit-real-km-btn" class="km-control-btn" title="Editar KM Real">✏️</button>
                        <button id="reset-real-km-btn" class="km-control-btn" title="Resetar KM Real">🔄</button>
                    </div>
                </div>
                <div class="total-km-display trip-km">
                    <span class="total-km-label">🚗 KM em Corridas:</span>
                    <span class="total-km-value" id="total-km-traveled">0.0 km</span>
                </div>
            </div>
            
            <div class="stats-box">
                <div class="stat-card">
                    <div class="stat-label">Total Corridas</div>
                    <div class="stat-value" id="total-corridas">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Ganho Total</div>
                    <div class="stat-value" id="ganho-total">R$ 0</div>
                    <!-- Added net profit display -->
                    <div class="stat-net" id="ganho-liquido"></div>
                </div>
            </div>
            <div id="historico-lista" style="margin-top: 20px;"></div>
            <button id="limpar-historico" class="button limpar-btn">Limpar Histórico</button>
        </div>
    </div>
</div>

<!-- iOS-style picker wheel overlay -->
<div id="picker-overlay" class="picker-overlay hidden">
    <div class="picker-container">
        <div class="picker-header">
            <div class="picker-title" id="picker-title">Selecione o valor</div>
            <button class="picker-close" id="picker-close">×</button>
        </div>
        <div class="picker-wheel" id="picker-wheel">
            <div class="picker-highlight"></div>
        </div>
        <button class="button picker-confirm" id="picker-confirm">Confirmar</button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
