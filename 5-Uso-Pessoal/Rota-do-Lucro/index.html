<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Abastecimento - Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            color: #1f2937;
        }

        .icon {
            width: 2rem;
            height: 2rem;
            fill: currentColor;
        }

        

        .container {
            max-width: 32rem;
            margin: 0 auto;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid #f3f4f6;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .icon-container {
            padding: 0.75rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-container.green {
            background-color: #dcfce7;
            color: #16a34a;
        }

        .icon-container.blue {
            background-color: #dbeafe;
            color: #2563eb;
        }

        .icon-container.emerald {
            background-color: #d1fae5;
            color: #059669;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1f2937;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.75rem;
            font-size: 1rem;
            transition: all 0.2s;
            background: white;
        }

        .form-input:focus {
            outline: none;
            border-color: transparent;
            box-shadow: 0 0 0 2px #3b82f6;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-green {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3);
        }

        .btn-blue {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
        }

        .result-box {
            margin-top: 1rem;
            padding: 1rem;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 0.75rem;
            color: #166534;
            font-weight: 500;
            text-align: center;
        }

        .result-box.error {
            background: #fef2f2;
            border-color: #fecaca;
            color: #dc2626;
        }

        .total-profit {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
        }

        .total-profit-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .total-profit-label {
            color: #bbf7d0;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .total-profit-value {
            font-size: 1.875rem;
            font-weight: 700;
        }

        .rides-history {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid #f3f4f6;
            overflow: hidden;
        }

        .rides-header {
            background: #f9fafb;
            padding: 1.5rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .rides-header h3 {
            font-size: 1.125rem;
            font-weight: 600;
            color: #1f2937;
        }

        .rides-list {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .ride-item {
            background: #f9fafb;
            border-radius: 0.75rem;
            padding: 1rem;
            border: 1px solid #f3f4f6;
        }

        .ride-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .ride-number {
            background: #dbeafe;
            color: #1e40af;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .ride-profit {
            font-weight: 700;
            font-size: 1.125rem;
        }

        .ride-profit.positive {
            color: #16a34a;
        }

        .ride-profit.negative {
            color: #dc2626;
        }

        .ride-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            font-size: 0.875rem;
        }

        .ride-detail {
            display: flex;
            flex-direction: column;
        }

        .ride-detail.full-width {
            grid-column: span 2;
        }

        .ride-detail-label {
            color: #6b7280;
            margin-bottom: 0.25rem;
        }

        .ride-detail-value {
            font-weight: 500;
            color: #1f2937;
        }

        .ride-detail-value.expense {
            color: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
        }

        .empty-state .icon {
            width: 3rem;
            height: 3rem;
            color: #d1d5db;
            margin: 0 auto 1rem;
        }

        .empty-state h3 {
            color: #6b7280;
            font-size: 1.125rem;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: #9ca3af;
            font-size: 0.875rem;
        }

        @media (max-width: 640px) {
            .container {
                padding: 1rem 0.75rem;
            }
            
            .card {
                padding: 1.25rem;
            }
            
            .header {
                padding: 1.5rem 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Card Abastecimento -->
        <div class="card">
            <div class="card-header">
                <div class="icon-container green">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="22" x2="21" y2="22"/>
                        <line x1="6" y1="18" x2="6" y2="11"/>
                        <line x1="10" y1="18" x2="10" y2="11"/>
                        <line x1="14" y1="18" x2="14" y2="11"/>
                        <line x1="18" y1="18" x2="18" y2="11"/>
                        <polygon points="12 2 20 7 4 7"/>
                    </svg>
                </div>
                <h2 class="card-title">Adicionar Abastecimento</h2>
            </div>

            <div class="form-group">
                <label class="form-label">Preço do Litro (R$)</label>
                <input type="number" step="0.01" id="precoLitro" class="form-input" placeholder="Ex: 5.89">
            </div>

            <div class="form-group">
                <label class="form-label">Valor Abastecido (R$)</label>
                <input type="number" step="0.01" id="valorAbastecido" class="form-input" placeholder="Ex: 50.00">
            </div>

            <div class="form-group">
                <label class="form-label">Autonomia da Moto (km/L)</label>
                <input type="number" step="0.1" id="autonomia" class="form-input" placeholder="Ex: 35.5">
            </div>

            <button class="btn btn-green" onclick="calcularAbastecimento()">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <path d="M9 9h6v6H9z"/>
                </svg>
                Calcular Abastecimento
            </button>

            <div id="resultadoAbastecimento"></div>
        </div>

        <!-- Card Corridas -->
        <div class="card">
            <div class="card-header">
                <div class="icon-container blue">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/>
                    </svg>
                </div>
                <h2 class="card-title">Registrar Corrida</h2>
            </div>

            <div class="form-group">
                <label class="form-label">Valor da Corrida (R$)</label>
                <input type="number" step="0.01" id="valorCorrida" class="form-input" placeholder="Ex: 25.50">
            </div>

            <div class="form-group">
                <label class="form-label">Quilômetros Percorridos</label>
                <input type="number" step="0.1" id="kmPercorridos" class="form-input" placeholder="Ex: 15.2">
            </div>

            <button class="btn btn-blue" onclick="registrarCorrida()">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Adicionar Corrida
            </button>
        </div>

        <!-- Lucro Total -->
        <div id="lucroTotalCard" class="total-profit" style="display: none;">
            <div class="total-profit-content">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="1" x2="12" y2="23"/>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
                <div>
                    <p class="total-profit-label">Lucro Total</p>
                    <p class="total-profit-value" id="lucroTotalValor">R$ 0,00</p>
                </div>
            </div>
        </div>

        <!-- Histórico de Corridas -->
        <div id="historicoCard" class="rides-history" style="display: none;">
            <div class="rides-header">
                <h3>Histórico de Corridas</h3>
            </div>
            <div class="rides-list" id="listaCorreidas">
            </div>
        </div>

        <!-- Estado Vazio -->
        <div id="estadoVazio" class="empty-state">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/>
            </svg>
            <h3>Nenhuma corrida registrada ainda</h3>
            <p>Adicione seu primeiro abastecimento e registre suas corridas</p>
        </div>
    </div>

    <script>
        let precoLitro = 0;
        let autonomia = 0;
        let litrosDisponiveis = 0;
        let kmDisponiveis = 0;
        let corridas = [];

        function calcularAbastecimento() {
            const precoLitroValue = parseFloat(document.getElementById('precoLitro').value);
            const valorAbastecidoValue = parseFloat(document.getElementById('valorAbastecido').value);
            const autonomiaValue = parseFloat(document.getElementById('autonomia').value);

            if (isNaN(precoLitroValue) || isNaN(valorAbastecidoValue) || isNaN(autonomiaValue) || 
                precoLitroValue <= 0 || valorAbastecidoValue <= 0 || autonomiaValue <= 0) {
                document.getElementById('resultadoAbastecimento').innerHTML = 
                    '<div class="result-box error">⚠️ Preencha todos os campos com valores válidos!</div>';
                return;
            }

            precoLitro = precoLitroValue;
            autonomia = autonomiaValue;
            litrosDisponiveis = valorAbastecidoValue / precoLitroValue;
            kmDisponiveis = litrosDisponiveis * autonomiaValue;

            document.getElementById('resultadoAbastecimento').innerHTML = 
                `<div class="result-box">⛽ Foram abastecidos ${litrosDisponiveis.toFixed(2)} L → autonomia de ${kmDisponiveis.toFixed(1)} km</div>`;
        }

        function registrarCorrida() {
            const valor = parseFloat(document.getElementById('valorCorrida').value);
            const km = parseFloat(document.getElementById('kmPercorridos').value);

            if (isNaN(valor) || isNaN(km) || autonomia === 0 || precoLitro === 0 || valor <= 0 || km <= 0) {
                alert("⚠️ Preencha os dados corretamente e calcule o abastecimento primeiro!");
                return;
            }

            const gastoGasolina = (km / autonomia) * precoLitro;
            const lucro = valor - gastoGasolina;

            corridas.push({ valor, km, gastoGasolina, lucro });
            
            // Limpar campos
            document.getElementById('valorCorrida').value = '';
            document.getElementById('kmPercorridos').value = '';

            atualizarInterface();
        }

        function atualizarInterface() {
            const listaCorreidas = document.getElementById('listaCorreidas');
            const lucroTotalCard = document.getElementById('lucroTotalCard');
            const historicoCard = document.getElementById('historicoCard');
            const estadoVazio = document.getElementById('estadoVazio');
            const lucroTotalValor = document.getElementById('lucroTotalValor');

            if (corridas.length === 0) {
                lucroTotalCard.style.display = 'none';
                historicoCard.style.display = 'none';
                estadoVazio.style.display = 'block';
                return;
            }

            estadoVazio.style.display = 'none';
            lucroTotalCard.style.display = 'block';
            historicoCard.style.display = 'block';

            // Calcular lucro total
            const totalLucro = corridas.reduce((total, corrida) => total + corrida.lucro, 0);
            lucroTotalValor.textContent = `R$ ${totalLucro.toFixed(2)}`;

            // Atualizar lista de corridas
            listaCorreidas.innerHTML = '';
            corridas.forEach((corrida, index) => {
                const corridaElement = document.createElement('div');
                corridaElement.className = 'ride-item';
                corridaElement.innerHTML = `
                    <div class="ride-header" style="display: flex; justify-content: space-between; align-items: center;">
                        <span class="ride-number">Corrida ${index + 1}</span>
                        <span class="ride-profit ${corrida.lucro >= 0 ? 'positive' : 'negative'}">
                            R$ ${corrida.lucro.toFixed(2)}
                        </span>
                    </div>
                    <div class="ride-details">
                        <div class="ride-detail">
                            <span class="ride-detail-label">Valor Recebido</span>
                            <span class="ride-detail-value">R$ ${corrida.valor.toFixed(2)}</span>
                        </div>
                        <div class="ride-detail">
                            <span class="ride-detail-label">KM Rodados</span>
                            <span class="ride-detail-value">${corrida.km.toFixed(1)} km</span>
                        </div>
                        <div class="ride-detail full-width">
                            <span class="ride-detail-label">Gasto em Gasolina</span>
                            <span class="ride-detail-value expense">R$ ${corrida.gastoGasolina.toFixed(2)}</span>
                        </div>
                    </div>
                `;
                listaCorreidas.appendChild(corridaElement);
            });
        }

        // Inicializar interface
        atualizarInterface();
    </script>
</body>
</html>
