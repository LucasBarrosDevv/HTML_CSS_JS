<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviso - Abra em outro navegador</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Efeito de partículas flutuantes */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 80%, rgba(255, 0, 80, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(37, 244, 238, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
      animation: float 20s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      33% { transform: translateY(-20px) rotate(120deg); }
      66% { transform: translateY(10px) rotate(240deg); }
    }

    .container {
      position: relative;
      z-index: 1;

      max-width: 400px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.3),
        0 0 0 1px rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, #ff0050, #25f4ee, #ff0050);
      background-size: 200% 100%;
      animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .icon {
      font-size: 48px;
      margin-bottom: 20px;
      background: linear-gradient(45deg, #ff0050, #25f4ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    h1 {
      font-size: 28px;
      margin-bottom: 16px;
      font-weight: 700;
      background: linear-gradient(45deg, #ffffff, #25f4ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      margin-bottom: 30px;
      font-size: 16px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 400;
    }

    button {
      display: block;
      width: 100%;
      margin: 16px 0;
      padding: 16px 24px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    button:hover::before {
      left: 100%;
    }

    .copy-link {
      background: linear-gradient(135deg, #ff0050, #ff4081);
      color: white;
      box-shadow: 0 8px 24px rgba(255, 0, 80, 0.3);
    }

    .copy-number {
      background: linear-gradient(135deg, #25f4ee, #00bcd4);
      color: white;
      box-shadow: 0 8px 24px rgba(37, 244, 238, 0.3);
    }

    .copy-link:hover { 
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(255, 0, 80, 0.4);
    }

    .copy-number:hover { 
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(37, 244, 238, 0.4);
    }

    button:active {
      transform: translateY(0px);
    }

    .phone-info {
      margin-top: 24px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .phone-info small {
      display: block;
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .phone-number {
      font-size: 20px;
      font-weight: 700;
      color: #25f4ee;
      text-shadow: 0 0 10px rgba(37, 244, 238, 0.3);
    }

    /* Animação de sucesso */
    .success-animation {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(37, 244, 238, 0.9);
      color: #000;
      padding: 20px 40px;
      border-radius: 16px;
      font-weight: 600;
      z-index: 1000;
      animation: successPop 0.5s ease-out;
    }

    @keyframes successPop {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    /* Responsividade */
    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
        margin: 10px;
      }
      
      h1 {
        font-size: 24px;
      }
      
      .icon {
        font-size: 40px;
      }
    }

    .card1 {
      max-width: 400px;
      transform: skewX(-20deg);
    }
    .card2 {
      max-width: 400px;
      transform: skewX(-30deg);
    }

  </style>
</head>
<body>
  <div class="card2">
    <div class="card1">
      <div class="container">
        <div class="card">
          <div class="icon">📱</div>
          <h1>O TikTok bloqueia redirecionamento para o WhatsApp</h1>
          <p>O navegador do TikTok bloqueia links para o WhatsApp. Copie o link ou meu número e abra no seu navegador normal para continuar nossa conversa! 💬</p>
          <button class="copy-link">
            📋 Copiar link da página
          </button>
    
          <button class="copy-number">
            📱 Copiar número do WhatsApp
          </button>
          <div class="phone-info">
            <small>Meu número:</small>
            <div class="phone-number">(99) 99233-2093</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const linkBtn = document.querySelector(".copy-link");
    const numberBtn = document.querySelector(".copy-number");

    const pageLink = window.location.href; 
    const phoneNumber = "(99) 99233-2093";

    function showSuccessMessage(message) {
      // Remove mensagem anterior se existir
      const existingMessage = document.querySelector('.success-animation');
      if (existingMessage) {
        existingMessage.remove();
      }

      // Cria nova mensagem
      const successDiv = document.createElement('div');
      successDiv.className = 'success-animation';
      successDiv.textContent = message;
      document.body.appendChild(successDiv);

      // Remove após 2 segundos
      setTimeout(() => {
        successDiv.remove();
      }, 2000);
    }

    linkBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(pageLink).then(() => {
        showSuccessMessage("✅ Link copiado! Cole em outro navegador.");
      }).catch(() => {
        // Fallback para navegadores mais antigos
        const textArea = document.createElement('textarea');
        textArea.value = pageLink;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        showSuccessMessage("✅ Link copiado! Cole em outro navegador.");
      });
    });

    numberBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(phoneNumber).then(() => {
        showSuccessMessage("✅ Número copiado! Abra o WhatsApp e cole para iniciar a conversa.");
      }).catch(() => {
        // Fallback para navegadores mais antigos
        const textArea = document.createElement('textarea');
        textArea.value = phoneNumber;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        showSuccessMessage("✅ Número copiado! Abra o WhatsApp e cole para iniciar a conversa.");
      });
    });

    // Adiciona efeito de hover nos botões para mobile
    const buttons = document.querySelectorAll('button');
    buttons.forEach(button => {
      button.addEventListener('touchstart', () => {
        button.style.transform = 'translateY(-2px)';
      });
      
      button.addEventListener('touchend', () => {
        setTimeout(() => {
          button.style.transform = 'translateY(0px)';
        }, 150);
      });
    });
  </script>
</body>
</html>
