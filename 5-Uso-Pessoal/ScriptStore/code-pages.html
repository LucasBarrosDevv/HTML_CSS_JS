<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Script-store</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- Seus estilos -->
    <link rel="stylesheet" href="styles/mobile.css">
    <link rel="stylesheet" href="styles/desktop.css">
    <link rel="stylesheet" href="styles/desktop4k.css">
    <link rel="stylesheet" href="styles/styles.css">
  </head>

  <body>
    <header>
      <div class="menu-toggle" onclick="toggleMenu()">☰ Filtros</div>
      <div class="side-menu" id="sideMenu">
        <div class="tag-list">
          <button class="tag-button active" data-tag="all" style="background:#00d1ff; color:#000">Todos</button>
          <button class="tag-button" data-tag="Fogo" style="background:#e63946; color:#fff">Fogo</button>
          <button class="tag-button" data-tag="Background" style="background:#1d1d1d; color:#fff">Background</button>
          <button class="tag-button" data-tag="Particulas" style="background:#7f5af0; color:#fff">Partículas</button>
          <button class="tag-button" data-tag="Animacao" style="background:#fbbf24; color:#000">Animação</button>
          <button class="tag-button" data-tag="Hacker" style="background:#00ff88; color:#000">Hacker</button>
          <button class="tag-button" data-tag="Cascata" style="background:#1fb6ff; color:#000">Cascata</button>
          <button class="tag-button" data-tag="Romantico" style="background:#ff3860; color:#fff">Romântico</button>
          <button class="tag-button" data-tag="Musica" style="background:#a56eff; color:#fff">Música</button>
          <button class="tag-button" data-tag="TikTok" style="background:#F62655; color:white; border:2px solid #04ebf7;">TikTok</button>
          <button class="tag-button" data-tag="Aniversario" style="background:#ffe347; color:#000">Aniversário</button>
        </div>
      </div>
      <div class="overlay" id="menuOverlay" onclick="toggleMenu()"></div>

      <div class="view-toggle">
        <button id="cardsViewBtn" class="view-btn active">Cards</button>
      </div>
    </header>

    <section class="codes">
      <section class="codes-category">
        <!-- Aqui os cards serão renderizados pelo JS -->
        <div class="codes-grid"></div>
      </section>
    </section>

    <!-- Seção Screen Mode para Desktop -->
    <section class="codes-screen-desktop" id="codesScreenDesktop">
      <!-- Os cards também podem ser clonados para cá via JS -->
    </section>

    <footer>
      <div class="footer-container">
        <div class="footer-left">
          <h2 style="text-align:center;">
            <span style="color:#00d1ff;">Script</span>
            <span style="color:orange;">Store</span>
          </h2>
          <p>&copy; 2025 Todos os direitos reservados.</p>
        </div>
        <div class="footer-right">
          <a href="https://www.tiktok.com/@lucasbarros7021" target="_blank" title="TikTok"><i class="fab fa-tiktok"></i></a>
          <a href="https://wa.me/5599991299667" target="_blank" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
          <a href="#" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="Voltar ao topo"><i class="fas fa-arrow-up"></i></a>
        </div>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="scripts/cardsData.js"></script>
    <script src="scripts/renderCards.js"></script>
    <script src="scripts/script.js"></script>
    <script src="scripts/mobile.js"></script>
  </body>
</html>
