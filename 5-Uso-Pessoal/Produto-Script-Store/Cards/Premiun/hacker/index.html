<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tela Estilo Hacker</title>
  <style>
    /* Fundo preto e texto verde */
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: black;
      height: 100vh;
    }
    canvas {
      display: block;
      background-color: black;
    }
  </style>
</head>
<body>
  <canvas id="hackerCanvas"></canvas>

  <script>
    const canvas = document.getElementById('hackerCanvas');
    const ctx = canvas.getContext('2d');

    const fontSize = 18;
    const chars = '10';
    const green = '#00FF00';
    let drops = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const columns = Math.ceil(canvas.width / fontSize);
      drops = new Array(columns).fill(1);
    }

    function draw() {
      // Fundo com leve transparência pra criar o efeito de trilha
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = green;
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        ctx.fillText(text, x, y);

        // Reinicia a gota aleatoriamente quando sai da tela
        if (y > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    resizeCanvas(); // Inicializa

    setInterval(draw, 33); // ~30fps

    window.addEventListener('resize', resizeCanvas);
  </script>
</body>
</html>
